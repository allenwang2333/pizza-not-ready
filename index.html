<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Ready (No Ads)</title>
<style>
  :root{--ui:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  html,body{margin:0;height:100%;background:#bfe3f2;overflow:hidden;font-family:var(--ui);
    user-select:none;-webkit-user-select:none;color:#fff}
  #c{display:block;touch-action:none;position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}

  /* world labels */
  .bubble{background:#fff;color:#3b2a1a;border-radius:14px;padding:3px 10px;font-weight:800;font-size:15px;
    box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;
    border-bottom:0;border-top-color:#fff}
  .bubble.vip{background:#fff3c4}
  .bubble.vip:after{border-top-color:#fff3c4}
  .pat{height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin-top:3px;overflow:hidden}
  .pat i{display:block;height:100%;border-radius:2px}
  .bar{width:54px;height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;
    box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  .bar i{display:block;height:100%;background:linear-gradient(#ffe08a,#f6a623);border-radius:5px}
  .bar.green i{background:linear-gradient(#8ff5d2,#1fbf8f)}
  .tag{background:#e8553e;color:#fff;font-weight:900;font-size:11px;padding:2px 7px;border-radius:8px;
    box-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
  .money{color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 #1e7a4c,0 0 6px rgba(0,0,0,.4)}
  .alert{width:26px;height:26px;border-radius:50%;background:#ff5a4e;color:#fff;font-weight:900;font-size:18px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #b33326;animation:bob .6s ease-in-out infinite alternate}
  .upchip{pointer-events:auto;cursor:pointer;background:#fff8ec;color:#4a3112;font-weight:900;font-size:13px;
    padding:4px 10px;border-radius:12px;box-shadow:0 3px 0 #d9c3a0,0 4px 10px rgba(0,0,0,.2)}
  .upchip.ok{background:linear-gradient(#8ff5d2,#2fbf71);color:#063b22;box-shadow:0 3px 0 #1d8a50,0 4px 10px rgba(0,0,0,.2)}
  .upchip.max{background:#ffe9a8;cursor:default}
  .upchip kbd{display:inline-block}
  .icon{font-size:22px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
  .float{font-weight:900;font-size:20px;color:#7dffcf;text-shadow:0 2px 0 #106b45,0 0 8px rgba(0,0,0,.35)}
  .float.gold{color:#ffe17a;text-shadow:0 2px 0 #8a5a00,0 0 8px rgba(0,0,0,.35)}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}

  /* HUD */
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;
    align-items:center;pointer-events:none}
  #money{display:flex;align-items:center;gap:8px;background:linear-gradient(#2fbf71,#1d9a57);
    padding:5px 18px 5px 6px;border-radius:24px;font-size:24px;font-weight:900;
    box-shadow:0 4px 0 #136b3b,0 6px 14px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .pill{background:rgba(40,25,10,.5);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
  .pill:empty{display:none}
  #eventTag{background:linear-gradient(#ff7a45,#e8473b)}
  #money .coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f7c531 55%,#d99a0b);
    color:#a26a00;font-size:18px;display:flex;align-items:center;justify-content:center;text-shadow:none;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  #right{display:flex;gap:10px;pointer-events:auto}
  button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:8px 16px;font-weight:900;
    background:linear-gradient(#ffd56b,#f7b733);color:#5a3a06;box-shadow:0 4px 0 #b9821a,0 6px 12px rgba(0,0,0,.2);
    transition:transform .08s}
  button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b9821a}
  button:disabled{background:#b9b2a8;color:#eee;box-shadow:0 4px 0 #8a847c;cursor:default}
  #soundBtn,#zoomBtn{background:linear-gradient(#fff,#e9e2d6);color:#5a3a06;box-shadow:0 4px 0 #b5a993,0 6px 12px rgba(0,0,0,.2);padding:8px 12px}
  #upBtn.glow{animation:glow .9s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.15) drop-shadow(0 0 8px #ffe9a8)}}
  kbd{font:inherit;font-size:11px;background:rgba(0,0,0,.12);padding:1px 6px;border-radius:5px;margin-left:4px}
  #help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;
    background:rgba(40,25,10,.45);padding:5px 12px;border-radius:12px;pointer-events:none;white-space:nowrap}

  .modal{position:fixed;inset:0;background:rgba(30,18,8,.45);display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal[hidden]{display:none}
  .card{background:#fff8ec;color:#4a3112;border-radius:22px;padding:18px 18px 14px;width:min(540px,92vw);
    max-height:86vh;overflow:auto;box-shadow:0 8px 0 #d9c3a0,0 20px 50px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font-size:24px;font-weight:900;text-align:center;color:#e0592f}
  .row{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;background:#fff;border-radius:16px;
    box-shadow:0 3px 0 #ecdcc2}
  .row .ic{font-size:28px;width:46px;height:46px;border-radius:14px;background:#ffefd2;display:flex;
    align-items:center;justify-content:center}
  .row .tx{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px}
  .row .ds{font-size:12px;opacity:.75;margin-top:2px}
  .pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .pips i{width:10px;height:6px;border-radius:3px;background:#ecdcc2}
  .pips i.on{background:#f7a531}
  .row button{min-width:96px}
  .foot{display:flex;justify-content:space-between;margin-top:10px}
  #resetBtn{background:linear-gradient(#e9e2d6,#d6ccbc);color:#7a6a55;box-shadow:0 4px 0 #a99c88;font-size:12px}
  #toast{position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-10px);background:#fff8ec;color:#4a3112;
    padding:10px 18px;border-radius:16px;font-weight:800;font-size:15px;opacity:0;transition:.3s;pointer-events:none;
    text-align:center;max-width:80vw;box-shadow:0 4px 0 #d9c3a0,0 8px 20px rgba(0,0,0,.2)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .manager-control{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:13px;font-weight:700}
  #autoReserve{font:inherit;width:120px;max-width:100%;padding:5px;border:1px solid #d9c3a0;border-radius:8px;color:#4a3112}
  #autoEnabled{accent-color:#1d9a57}
  /* Mini window: keep only the essentials. */
  @media (max-width: 600px) {
    #help, .btxt, kbd, #zoomBtn{display:none}
    #hud{top:6px;left:6px;right:6px}
    #left{gap:3px}
    #right{gap:5px}
    #money{font-size:16px;padding:2px 10px 2px 3px;gap:5px}
    #money .coin{width:20px;height:20px;font-size:12px}
    button{padding:4px 8px;font-size:13px;border-radius:12px}
    .pill{font-size:9px;padding:2px 7px}
    #labels .lbl > *{zoom:.7}
    #toast{font-size:11px;top:44px;padding:6px 12px}
  }
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud">
  <div id="left">
    <div id="money"><span class="coin">$</span><span id="moneyVal">0</span></div>
    <div id="shopTag" class="pill"></div>
    <div id="goalTag" class="pill"></div>
    <div id="eventTag" class="pill"></div>
  </div>
  <div id="right">
    <button id="zoomBtn" title="Zoom (scroll wheel, - / =)">🔍</button>
    <button id="soundBtn" title="Sound (M)">🔊</button>
    <button id="shopsBtn">🗺️<span class="btxt"> Shops</span><kbd>L</kbd></button>
    <button id="upBtn">⬆️<span class="btxt"> Upgrades</span><kbd>U</kbd></button>
  </div>
</div>
<div id="help">WASD / arrows / hold mouse to move · scroll to zoom · walk onto ovens, mats, cash and $ zones · E upgrade nearby · trash bin drops items · L shops</div>
<div id="panel" class="modal" hidden>
  <div class="card">
    <h2>Upgrades</h2>
    <div id="upList"></div>
    <div class="row" id="managerBox">
      <div class="ic">💼</div><div class="tx">
        <div class="nm">Manager auto-upgrades</div>
        <div class="ds">Buys the cheapest equipment upgrade every 3 seconds. No unlocks, recipe upgrades, or offline spending.</div>
        <label class="manager-control"><input id="autoEnabled" type="checkbox"> Enable in this shop</label>
        <label class="manager-control" for="autoReserve">Keep at least $ <input id="autoReserve" type="number" min="0" step="100" inputmode="numeric"></label>
        <div id="autoStatus" class="ds" aria-live="polite"></div>
      </div>
    </div>
    <div class="foot">
      <button id="resetBtn">Reset progress</button>
      <button id="closeBtn">Close<kbd>Esc</kbd></button>
    </div>
  </div>
</div>
<div id="shops" class="modal" hidden>
  <div class="card">
    <h2>Your Shops</h2>
    <div id="shopList"></div>
    <div class="foot"><span></span><button id="shopsClose">Close<kbd>Esc</kbd></button></div>
  </div>
</div>
<div id="toast"></div>

<script src="vendor/three.min.js"></script>
<script>

// ================= helpers =================
let time = 0, nextId = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (x, y) => ({ x, y });

function moveTo(e, tx, ty, sp, dt) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= sp * dt || d < 0.5) { e.x = tx; e.y = ty; e.moving = false; return true; }
  e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
  e.dir = Math.atan2(dy, dx); e.moving = true;
  return false;
}
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e4) return '' + n;
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  return (n / 1e9).toFixed(2) + 'B';
}
function fmtDur(s) {
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + ' min';
  return (s / 3600).toFixed(1) + ' h';
}

function staffPointClear(p, rects) {

  if (navGrid) return navGrid;

  const cols = Math.floor((ROOM.w - 20) / 20) + 1, rows = Math.floor((ROOM.h - 20) / 20) + 1;
  const point = i => P(ROOM.x + 10 + (i % cols) * 20, ROOM.y + 10 + Math.floor(i / cols) * 20);

function pushOut(e, r, rad) {
  const cx = clamp(e.x, r.x, r.x + r.w), cy = clamp(e.y, r.y, r.y + r.h);

  if (d === 0) { // center inside the box: push out along the shortest axis
    const l = e.x - r.x, rt = r.x + r.w - e.x, t = e.y - r.y, b = r.y + r.h - e.y;
    const m = Math.min(l, rt, t, b);
    if (m === l) e.x = r.x - rad; else if (m === rt) e.x = r.x + r.w + rad;
    else if (m === t) e.y = r.y - rad; else e.y = r.y + r.h + rad;

function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = 0.04, delay = 0) {
  if (!S.sound || !AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  pop: () => tone(520 + Math.random() * 120, 0.05, 'sine', 0.02),
  cash: () => { tone(1320, 0.08, 'square', 0.02); tone(1760, 0.12, 'square', 0.02, 0.06); },
  unlock: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.05, i * 0.08)),
  up: () => { tone(660, 0.1, 'triangle', 0.05); tone(990, 0.15, 'triangle', 0.05, 0.08); },
};

// ================= effects =================
const fx = [];
function addFloat(x, y, t, cls = '') { fx.push({ k: 't', id: nextId++, x, y, t, cls, age: 0, life: 1.2 }); }
function addCoins(x, y, tgt, n) {
  for (let i = 0; i < n; i++) fx.push({ k: 'c', x0: x + rand(-10, 10), y0: y + rand(-10, 10), tgt, age: -i * 0.04, life: 0.45 });
}
function confetti(x, y) {
  for (let i = 0; i < 60; i++)
    fx.push({ k: 'p', px: X(x), py: 1, pz: Z(y), vx: rand(-3, 3), vy: rand(4, 9), vz: rand(-3, 3),
      c: pick(SHIRTS), r: rand(0, 6), age: 0, life: 1.6 });
}
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, sec = 3.5) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), sec * 1000);
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt;
    if (f.k === 'p') {
      f.vy -= 14 * dt; f.px += f.vx * dt; f.py = Math.max(0.02, f.py + f.vy * dt); f.pz += f.vz * dt;
      if (f.py <= 0.02) { f.vx *= 0.8; f.vz *= 0.8; }
    }
    if (f.age >= f.life) fx.splice(i, 1);
  }
}

// ================= update =================
function gain(amt) { S.money += amt; S.earned += amt; S.runEarned += amt; }
function earn(amt, x, y) {
  gain(amt);
  addFloat(x, y, '+$' + fmt(amt));
  goalProgress('earn', amt);
}

function updatePlayer(dt) {
  let vx = 0, vy = 0;
  if (keys.KeyW || keys.ArrowUp) vy--;
  if (keys.KeyS || keys.ArrowDown) vy++;
  if (keys.KeyA || keys.ArrowLeft) vx--;
  if (keys.KeyD || keys.ArrowRight) vx++;
  if (!vx && !vy && pointer.down) {
    pointerToWorld();
    const dx = pointer.x - player.x, dy = pointer.y - player.y, d = Math.hypot(dx, dy);
    if (d > 8) { vx = dx / d; vy = dy / d; }
  }
  const m = Math.hypot(vx, vy);
  if (m > 0) {
    const sp = playerSpeed(L.up.speed);
    player.x += vx / m * sp * dt; player.y += vy / m * sp * dt;
    player.dir = Math.atan2(vy, vx); player.moving = true;
  } else player.moving = false;
  player.x = clamp(player.x, ROOM.x + 14, ROOM.x + ROOM.w - 14);
  player.y = clamp(player.y, ROOM.y + 14, ROOM.y + ROOM.h - 14);
  for (const r of obstacles()) pushOut(player, r, 14);

  // pick up, drop off
  player.actT -= dt;
  const cap = carryCap(L.up.cap);
  if (player.actT <= 0) {
    for (const o of producers()) {
      if (o.stock > 0 && player.items.length < cap && dist(player, o.pick) < 50) {
        o.stock--; player.items.push(o.type); player.actT = 0.1; sfx.pop(); break;
      }
    }
  }
  if (player.actT <= 0 && player.items.length) {
    const where = dist(player, DROP) < 50 ? 'counter' : L.unlocked.drive && dist(player, DRIVE_DROP) < 50 ? 'drive' : null;
    const i = where ? dropIndex(player.items, where) : -1;
    if (i >= 0) { putItem(player.items.splice(i, 1)[0], where); player.actT = 0.07; sfx.pop(); }
  }
  // Trash bin: throw away carried items that have nowhere to go.
  // Only after standing on the mat for a moment, so walking past never throws pizzas away.
  const onTrash = Math.abs(player.x - TRASH.x) < 30 && Math.abs(player.y - TRASH.y) < 20;
  player.trashT = onTrash ? (player.trashT || 0) + dt : 0;
  if (player.actT <= 0 && player.items.length && player.trashT > 0.4) { player.items.pop(); player.actT = 0.05; sfx.pop(); }
  // collect cash
  for (const k in PILES) {
    if (L.piles[k] > 0 && dist(player, PILES[k]) < 50) {
      const amt = L.piles[k]; L.piles[k] = 0;
      earn(amt, player.x, player.y);
      addCoins(PILES[k].x, PILES[k].y - 10, player, Math.min(12, 3 + Math.floor(amt / 20)));
      sfx.cash();
    }
  }
  // clean tables
  for (const t of tables) {
    if (canCleanTable(t) && dist(player, t) < 75) {
      t.clean += dt * 1.6;
      if (t.clean >= 1) cleanTable(t, true);
    }
  }
}

function cleanTable(t, byPlayer) {
  if (!canCleanTable(t)) return;
  const tip = t.seats.reduce((a, s) => a + (s.dirty ? s.tip : 0), 0);
  for (const s of t.seats) if (s.dirty) { s.dirty = false; s.tip = 0; }
  if (byPlayer) { earn(tip, t.x, t.y); sfx.cash(); }
  else L.piles.main += tip;
  t.dirty = false; t.clean = 0;
  goalProgress('clean', 1);
}

function updateProducers(dt) {
  for (const o of producers()) {
    if (o.stock >= stockMax(o)) { o.timer = 0; continue; }
    o.timer += dt;
    if (o.timer >= bakeTime(o)) { o.timer = 0; o.stock++; }
  }
}

function updateWorkers(dt) {
  const sp = staffSpeed(L.up.staff) * (loc().special.staffMult || 1);
  for (const w of workers) {
    w.actT -= dt;
    if (w.type === 'cashier' || w.type === 'salesclerk') {
      const p = w.type === 'cashier' ? CASHIER : SALES_CASHIER;
      if (moveStaff(w, p.x, p.y, sp, dt)) w.dir = Math.PI / 2;
    }
    else if (w.type === 'driver') { if (moveStaff(w, DRIVE_CASHIER.x, DRIVE_CASHIER.y, sp, dt)) w.dir = Math.PI; }
    else if (w.type === 'carrier') updateCarrier(w, sp, dt, ovens);
    else if (w.type === 'barista') updateCarrier(w, sp, dt, stations);
    else if (w.type === 'restocker') updateCarrier(w, sp, dt, producers());
    else if (w.type === 'cleaner') updateCleaner(w, sp, dt);
    else if (w.type === 'manager') updateManager(w, sp, dt);
  }
}

// Carries items from the given sources (ovens or stations) to the counter or the drive-thru.
function updateCarrier(w, sp, dt, sources) {
  const cap = staffCap(L.up.staff);
  const ready = sources.filter(o => o.stock > 0);
  const need = o => Math.max(roomFor(o.type, 'counter') / counterCap(o.type),
    L.unlocked.drive ? roomFor(o.type, 'drive') / driveCap(o.type) : 0) +
    (w.type === 'restocker' && (queue.some(c => c.lane !== undefined && c.got[o.type] < c.order[o.type] && stockOf(o.type) === 0) ||
      (carQueue[0] && carQueue[0].got[o.type] < carQueue[0].order[o.type] && driveStock(o.type) === 0)) ? 2 : 0);
  if (w.state === 'fetch') {
    if (w.items.length >= cap || (w.items.length && !ready.length)) {
      w.state = 'deliver';
      w.dest = chooseDest(w.items);
      return;
    }
    if (!w.src || (w.src.stock === 0 && ready.length))
      w.src = (ready.length ? ready : sources).reduce((b, o) =>
        need(o) > need(b) || (need(o) === need(b) && (o.stock > b.stock || (o.stock === b.stock && o.timer > b.timer))) ? o : b);
    const p = w.src.pick;
    const offset = w.src.type === 'pizza' ? w.off : Math.abs(w.off);
    if (moveStaff(w, p.x + offset, p.y, sp, dt)) {
      w.dir = w.src.type === 'pizza' ? -Math.PI / 2 : Math.PI;
      if (w.src.stock > 0 && w.actT <= 0) { w.src.stock--; w.items.push(w.src.type); w.actT = 0.18; }
    }
  } else {
    const d = w.dest === 'drive' ? DRIVE_DROP : DROP;
    if (moveStaff(w, d.x + w.off, d.y, sp, dt) && w.actT <= 0) {
      const i = dropIndex(w.items, w.dest);
      if (i >= 0) { putItem(w.items.splice(i, 1)[0], w.dest); w.actT = 0.1; }
      else {
        // Nothing fits here: take the load to the other counter if it has room.
        const other = w.dest === 'drive' ? 'counter' : 'drive';
        if ((other === 'counter' || L.unlocked.drive) && dropIndex(w.items, other) >= 0) w.dest = other;
      }
      if (!w.items.length) { w.state = 'fetch'; w.src = null; }
    }
  }
}

// Banks every cash pile every few seconds.
function updateManager(w, sp, dt) {
  if (!moveStaff(w, MANAGER_POST.x, MANAGER_POST.y, sp, dt)) return;
  w.dir = Math.PI / 2;
  if (w.actT > 0) return;
  w.actT = 3;
  for (const k in PILES) {
    if (L.piles[k] <= 0) continue;
    const amt = L.piles[k]; L.piles[k] = 0;
    earn(amt, w.x, w.y);
    addCoins(PILES[k].x, PILES[k].y - 10, w, Math.min(8, 2 + Math.floor(amt / 40)));
  }
  autoUpgradeEquipment();
}

function updateCleaner(w, sp, dt) {
  if (!w.table || !canCleanTable(w.table)) w.table = tables.find(canCleanTable) || null;
  if (!w.table) { const p = WORKER_POST_IDLE.cleaner; moveStaff(w, p.x, p.y, sp, dt); return; }
  const t = w.table;
  const side = t.aisle < t.x ? -1 : 1;
  if (moveStaff(w, t.x + side * 60, t.y, sp, dt)) {
    w.dir = side < 0 ? 0 : Math.PI;
    t.clean += dt;
    if (t.clean >= 1) { cleanTable(t, false); w.table = null; }
  }
}

function makeOrder(vip) {
  const o = { pizza: randi(1, loc().orderMax) + (vip ? 3 : 0), soda: 0, cream: 0 };
  if (L.unlocked.soda && Math.random() < 0.6) o.soda = randi(1, 2) + (vip ? 1 : 0);
  if (L.unlocked.cream && Math.random() < (loc().special.creamChance || 0.45)) o.cream = 1 + (vip ? 1 : 0);
  return o;
}
const orderSize = o => o.pizza + o.soda + o.cream;
const orderLeft = c => ITEM_TYPES.some(t => c.got[t] < c.order[t]);

const partySize = c => 1 + (c.guests?.length || 0);
const queueSize = () => queue.reduce((n, c) => n + partySize(c), 0);
function newCustomer(vip = false) {
  return {
    id: nextId++, x: SPAWN.x + rand(-8, 8), y: SPAWN.y, dir: -Math.PI / 2, moving: true,
    order: makeOrder(vip), got: { pizza: 0, soda: 0, cream: 0 }, items: [], vip,
    patience: vip ? VIP_PATIENCE : PATIENCE, dine: Math.random() < 0.65,
    state: 'queue', path: [], next: null, table: null, timer: 0, seed: Math.random() * 10,
    shirt: vip ? '#f5c242' : pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIRS), pants: pick(PANTS), hairStyle: randi(0, 2),
  };
}
function spawnCustomer(size) {
  const room = MAX_QUEUE - queueSize();
  if (room <= 0) return null;
  const vip = vipPending;
  vipPending = false;
  const maxGroup = Math.max(1, ...tables.map(seatCount));
  size = vip ? 1 : Math.min(room, size ?? (maxGroup > 1 && Math.random() < 0.28 ? randi(2, maxGroup) : 1));
  const c = newCustomer(vip);
  c.guests = Array.from({ length: size - 1 }, () => newCustomer());
  if (c.guests.length) {
    c.dine = true; c.personalOrder = { ...c.order };
    for (const guest of c.guests) for (const t of ITEM_TYPES) c.order[t] += guest.order[t];
    c.patience += 15 * c.guests.length;
  }
  queue.push(c);
  return c;
}

function finishOrder(c) {
  const index = queue.indexOf(c);
  if (index < 0) return;
  queue.splice(index, 1);
  const pay = Math.round(ITEM_TYPES.reduce((a, t) => a + c.order[t] * itemPrice(t), 0) * (c.vip ? 3 : 1));
  L.piles.main += pay;
  addFloat(c.x, QUEUE_Y, (c.vip ? '👑 $' : '$') + fmt(pay), 'gold');
  L.rating = Math.min(5, L.rating + (c.vip ? 0.15 : 0.03));
  const diners = [c, ...(c.guests || [])];
  goalProgress('serve', diners.length);
  // Reserve all seats together. A group never splits across tables or waits for seats.
  const freeSeats = t => t.seats.flatMap((s, i) => i < seatCount(t) && !s.occupant && !s.dirty ? [i] : []);
  const available = c.dine ? tables.filter(t => !t.dirty && freeSeats(t).length >= diners.length) : [];
  const empty = available.filter(tableEmpty);
  const table = (empty.length ? empty : available)
    .reduce((nearest, t) => !nearest || dist(c, t) < dist(c, nearest) ? t : nearest, null);
  const seats = table ? freeSeats(table) : [];
  if (c.personalOrder) c.order = c.personalOrder;
  c.guests = [];
  diners.forEach((diner, i) => {
    diner.items = ITEM_TYPES.flatMap(t => Array(diner.order[t]).fill(t));
    diner.state = 'walk';
    if (table) {
      const si = seats[i], st = SEATS[si], row = table.y + (st.dy > 0 ? 80 : -80);
      table.seats[si].occupant = diner; diner.table = table; diner.seat = si; diner.next = 'eat';
      diner.path = [P(table.aisle, QUEUE_Y), P(table.aisle, row), P(table.x + st.dx, row), P(table.x + st.dx, table.y + st.dy)];
    } else {
      diner.next = 'gone';
      diner.path = [P(LEAVE_X + i * 15, QUEUE_Y + 10), P(LEAVE_X + i * 15, 860)];
    }
    walkers.push(diner);
  });
}

function leaveAngry(c, i) {
  queue.splice(i, 1);
  for (const t of ITEM_TYPES) L[STOCK_KEY[t]] = Math.min(counterCap(t), stockOf(t) + c.got[t]);
  L.rating = Math.max(1, L.rating - 0.2);
  const diners = [c, ...(c.guests || [])];
  c.guests = [];
  for (const diner of diners) {
    diner.angry = true; diner.state = 'walk'; diner.next = 'gone';
    diner.path = [P(LEAVE_X, diner.y + 10), P(LEAVE_X, 860)];
    walkers.push(diner);
  }
  addFloat(c.x, c.y, '😡 left');
}

function updateCustomers(dt) {
  spawnT -= dt;
  if (spawnT <= 0) {
    const c = spawnCustomer();
    // Groups replace individual arrivals instead of increasing demand by 2–4×.
    spawnT = spawnTime() * rand(0.7, 1.3) * (c ? partySize(c) : 1);
  }
  // Keep an order at its assigned register until it finishes, even if the other lane empties.
  const laneCount = L.unlocked.salesclerk ? 2 : 1;
  const occupied = new Set(queue.filter(c => c.lane !== undefined).map(c => c.lane));
  for (const c of queue) if (c.lane === undefined) {
    const lane = Array.from({ length: laneCount }, (_, i) => i).find(i => !occupied.has(i));
    if (lane === undefined) break;
    c.lane = lane; occupied.add(lane);
  }
  let row = QUEUE_Y + QUEUE_GAP + (queue.some(c => c.lane !== undefined && partySize(c) > 1) ? 52 : 0);
  for (const c of queue) {
    const serving = c.lane !== undefined;
    moveTo(c, serving ? servicePoint(c.lane).x : QUEUE_X, serving ? QUEUE_Y : row, 110, dt);
    (c.guests || []).forEach((guest, i) => {
      moveTo(guest, c.x + (i % 2 ? 25 : -25), c.y + 24 + Math.floor(i / 2) * 26, 110, dt);
    });
    if (!serving) row += QUEUE_GAP + (partySize(c) > 1 ? 26 * Math.ceil((partySize(c) - 1) / 2) : 0);
  }
  const canServe = c => c.lane !== undefined && c.x === servicePoint(c.lane).x && c.y === QUEUE_Y && clerkPresent(c.lane);
  // Waiting customers lose patience, except while the front one is actively being served.
  for (let i = queue.length - 1; i >= 0; i--) {
    const c = queue[i];
    const busy = canServe(c) && ITEM_TYPES.some(t => c.got[t] < c.order[t] && stockOf(t) > 0);
    if (!busy) c.patience -= dt;
    if (c.patience <= 0) leaveAngry(c, i);
  }
  for (const f of queue.filter(canServe)) {
    serveTimers[f.lane] -= dt;
    if (serveTimers[f.lane] <= 0) {
      const t = ITEM_TYPES.find(t => f.got[t] < f.order[t] && stockOf(t) > 0);
      if (t) { L[STOCK_KEY[t]]--; f.got[t]++; serveTimers[f.lane] = 0.22 * speedUp('counter'); }
    }
    if (!orderLeft(f)) finishOrder(f);
  }
  for (let i = walkers.length - 1; i >= 0; i--) {
    const c = walkers[i];
    if (c.state === 'eat') {
      c.timer -= dt;
      if (c.timer <= 0) {
        const t = c.table, st = SEATS[c.seat], seat = t.seats[c.seat], row = t.y + (st.dy > 0 ? 80 : -80);
        seat.occupant = null; seat.dirty = true; t.dirty = true;
        seat.tip = Math.round(price() * orderSize(c.order) * 0.5 * (c.vip ? 3 : 1) * (1 + 0.5 * (lvOf(t.id) - 1))) + 2;
        c.table = null; c.state = 'walk'; c.next = 'gone';
        c.path = [P(t.x + st.dx, row), P(t.aisle, row), P(t.aisle, 740), P(LEAVE_X, 760), P(LEAVE_X, 860)];
      }
      continue;
    }
    if (c.path.length) { const p = c.path[0]; if (moveTo(c, p.x, p.y, 110, dt)) c.path.shift(); }
    else if (c.next === 'eat') { c.state = 'eat'; c.timer = rand(6, 10) * (1 - 0.12 * (lvOf(c.table.id) - 1)); c.eatTotal = c.timer; c.items = []; c.dir = SEATS[c.seat].dy > 0 ? -Math.PI / 2 : Math.PI / 2; c.moving = false; }
    else walkers.splice(i, 1);
  }
}

// Rush hours and VIP visits, once the shop has a cashier.
function updateEvents(dt) {
  if (!L.unlocked.cashier) return;
  if (rushLeft > 0) {
    rushLeft -= dt;
    if (rushLeft <= 0) toast('Rush hour is over. Nice work!');
  } else if ((rushT -= dt) <= 0) {
    rushT = rushDelay(); rushLeft = loc().special.rushDuration || 45; spawnT = 0;
    toast(`🔥 ${loc().special.rushEvery ? 'Office lunch rush' : 'Rush hour'}! Lots of customers for ${rushLeft} seconds`, 4);
  }
  if ((vipT -= dt) <= 0) {
    vipT = rand(150, 260); vipPending = true; spawnT = Math.min(spawnT, 0.5);
    toast('👑 A VIP is on the way: big order, 3× pay', 4);
  }
}

// ---- goals ----
const GOAL_TEXT = {
  serve: n => `Serve ${n} customers`, clean: n => `Clean ${n} tables`,
  drive: n => `Serve ${n} drive-thru cars`, earn: n => `Collect $${fmt(n)}`,
};
function newGoal() {
  const types = ['serve', 'earn'];
  if (L.unlocked.table1) types.push('clean');
  if (L.unlocked.drive) types.push('drive');
  const n = L.goalsDone, type = types[n % types.length];
  const target = { serve: 10 + 5 * n, clean: 5 + 3 * n, drive: 4 + 2 * n, earn: Math.round(price() * (40 + 25 * n)) }[type];
  L.goal = { type, target, progress: 0, reward: Math.round(price() * (12 + 6 * n)) };
}
function goalProgress(type, amt) {
  const g = L.goal;
  if (!g || g.type !== type) return;
  g.progress += amt;
  if (g.progress < g.target) return;
  L.goalsDone++;
  gain(g.reward);
  addFloat(player.x, player.y, '🎯 +$' + fmt(g.reward), 'gold');
  confetti(player.x, player.y); sfx.unlock();
  toast(`🎯 Goal done: ${GOAL_TEXT[g.type](g.target)}! +$${fmt(g.reward)}`);
  newGoal();
}

function makeCarOrder() {
  const o = { pizza: randi(3, 6), soda: 0, cream: 0 };
  // Only once a barista can keep the drive-thru stocked; one car waiting on a drink blocks the lane.
  if (!L.unlocked.barista) return o;
  if (L.unlocked.soda && Math.random() < 0.6) o.soda = randi(1, 3);
  if (L.unlocked.cream && Math.random() < (loc().special.creamChance || 0.45)) o.cream = randi(1, 2);
  return o;
}

function updateCars(dt) {
  if (L.unlocked.drive) {
    carT -= dt;
    if (carT <= 0) {
      carT = carTime() * rand(0.8, 1.2);
      if (carQueue.length < 3) carQueue.push({ id: nextId++, x: CAR_X, y: 900, order: makeCarOrder(),
        got: { pizza: 0, soda: 0, cream: 0 }, color: pick(CAR_COLORS) });
    }
  }
  carQueue.forEach((c, i) => moveTo(c, CAR_X, CAR_Y + i * CAR_GAP, 170, dt));
  const f = carQueue[0];
  if (f && f.y === CAR_Y && drivePresent()) {
    driveServeT -= dt;
    if (driveServeT <= 0) {
      const t = ITEM_TYPES.find(t => f.got[t] < f.order[t] && driveStock(t) > 0);
      if (t) { L[DRIVE_KEY[t]]--; f.got[t]++; driveServeT = 0.2 * speedUp('drive'); }
    }
    if (!orderLeft(f)) {
      carQueue.shift(); driveServeT = 0.4;
      const pay = Math.round(ITEM_TYPES.reduce((a, t) => a + f.order[t] * itemPrice(t), 0) * 1.5 * (1 + 0.1 * (lvOf('drive') - 1)));
      L.piles.drive += pay;
      addFloat(CAR_X, CAR_Y, '$' + fmt(pay), 'gold');
      goalProgress('drive', 1);
      carsOut.push(f);
    }
  }
  for (let i = carsOut.length - 1; i >= 0; i--)
    if (moveTo(carsOut[i], CAR_X, -150, 230, dt)) carsOut.splice(i, 1);
}

function updateZones(dt) {
  for (const d of visibleZones()) {
    const inside = Math.abs(player.x - d.x) < 38 && Math.abs(player.y - d.y) < 38;
    if (!inside) { zoneStand[d.id] = 0; continue; }
    zoneStand[d.id] = (zoneStand[d.id] || 0) + dt;
    if (zoneStand[d.id] < 0.25 || S.money <= 0) continue;
    const paid = L.paid[d.id] || 0, cost = zoneCost(d);
    const amt = Math.min(Math.max(cost / 1.5, 20) * dt, S.money, cost - paid);
    S.money -= amt; L.paid[d.id] = paid + amt;
    if (Math.random() < 0.3) fx.push({ k: 'c', x0: player.x, y0: player.y, tgt: P(d.x, d.y), age: 0, life: 0.35 });
    if (L.paid[d.id] >= cost - 1e-6) unlock(d);
  }
}

function unlock(d) {
  if (d === NEW_SHOP) {
    delete L.paid[d.id];
    S.shops.push(newShop());
    goToShop(S.shops.length - 1);
    sfx.unlock();
    return;
  }
  L.unlocked[d.id] = true; delete L.paid[d.id];
  syncWorld(); confetti(d.x, d.y); sfx.unlock();
  toast(d.id === 'salesclerk' ? '💁 Sales Clerk hired! Two orders can now be served at once.'
    : d.id === 'restocker' ? '📦 Restocking Assistant hired! Carries all products and prioritizes missing order items.'
    : `${d.icon} ${d.name} unlocked!`);
  save();
}

function goToShop(i) {
  save();
  S.cur = i; L = S.shops[i];
  for (const a of [ovens, stations, tables, workers, queue, walkers, carQueue, carsOut, fx]) a.length = 0;
  Object.assign(player, { x: 600, y: 210, items: [], dir: Math.PI / 2, moving: false });
  spawnT = 1.5; carT = 4; serveTimers.fill(0); driveServeT = 0;
  rushLeft = 0; rushT = rushDelay(); vipT = rand(150, 260); vipPending = false;
  syncWorld();
  if (!L.goal) newGoal();
  resetScene();
  toast(`${loc().icon} Welcome to ${loc().name}!`);
  save();
}

function update(dt) {
  time += dt;

  const bg = otherShopsRate();
  gain(bg * dt);
  updateEvents(dt);
  updatePlayer(dt);
  updateProducers(dt);

  updateCustomers(dt);
  updateCars(dt);

  updateFx(dt);
}

// Money per second a shop makes without the player. Needs a cashier and a baker.
function idleRateFor(sh, li) {
  const u = sh.unlocked, lc = LOCATIONS[li];
  if (!u.cashier || !u.carrier1) return 0;
  const ovenIds = Object.keys(OVEN_POS).filter(id => u[id]), nOvens = ovenIds.length;
  const tableLv = tableScore(sh, Object.keys(TABLE_POS).filter(id => u[id]));
  const prod = ovenIds.reduce((a, id) => a + 1 / (ovenTime(sh.up.oven) * (1 - 0.15 * (lvOf(id, sh) - 1))), 0);
  const drive = u.drive && u.driver ? 4.5 / carTimeOf(sh.up.cust, li) : 0;
  const rushDemand = lc.special.rushEvery ? 1 + 1.5 * lc.special.rushDuration / (lc.special.rushEvery + lc.special.rushDuration) : 1;
  const demand = (1 + lc.orderMax) / 2 / spawnTimeOf(sh.up.cust, nOvens, tableLv, sh.rating) * rushDemand + drive;
  const haul = (CARRIERS.filter(id => u[id]).length + (u.restocker ? 1 : 0)) * staffCap(sh.up.staff) / 7 * (lc.special.staffMult || 1);
  const extras = 1 + (u.barista || u.restocker ? (u.soda ? 0.35 : 0) + (u.cream ? 0.3 * (lc.special.creamChance || 0.45) / 0.45 : 0) : 0);
  return Math.min(prod, demand, haul) * pizzaPrice(sh.up.price) * lc.priceMult * starMult() * extras * 0.5;
}
const idleRate = () => S.shops.reduce((a, sh, i) => a + idleRateFor(sh, i), 0);
const otherShopsRate = () => S.shops.reduce((a, sh, i) => i === S.cur ? a : a + idleRateFor(sh, i), 0);

// ---- prestige ----
const starsToGain = () => Math.floor(Math.sqrt(S.runEarned / 200000));
function sellFranchise() {
  const n = starsToGain();
  if (S.shops.length < 2 || n < 1) return;
  if (!confirm(`Sell the franchise? All shops and money reset. You get ${n} 🏆 (+${n * 10}% income forever).`)) return;
  S.stars += n; S.money = 0; S.runEarned = 0;
  S.shops = [newShop()];
  goToShop(0);
  toast(`🏆 Franchise sold! You have ${S.stars} 🏆: +${S.stars * 10}% income`, 5);
}
function creditAway(sec) {
  sec = Math.min(sec, 8 * 3600);
  const amt = Math.floor(idleRate() * sec);
  if (amt > 0) {
    gain(amt); sfx.cash();

  }
}

function drawZone(o, d) {
  const cost = zoneCost(d), paid = L.paid[d.id] || 0, left = Math.ceil(cost - paid), afford = S.money >= cost - paid;
  const info = d.id === 'soda' && loc().special.drinkName ? itemInfo('soda') : d;
  const key = `${left}|${afford}|${info.name}`;

  c.fillStyle = 'rgba(46,200,120,.8)'; c.fillRect(0, 256 - 256 * frac, 256, 256 * frac);
  c.restore();
  c.setLineDash([26, 16]); c.lineWidth = 12; c.strokeStyle = afford ? '#22b573' : '#ffffff';
  c.beginPath(); c.roundRect(14, 14, 228, 228, 36); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const name = info.name.toUpperCase();
  c.fillStyle = '#4a3112'; c.font = `900 30px ${UI_FONT}`;
  const nw = c.measureText(name).width;

  o.armL.rotation.x = carrying ? -1.3 : sit ? -0.9 + Math.sin(time * 7 + e.seed) * 0.35 : -swing * 0.8;
  o.armR.rotation.x = carrying ? -1.3 : sit ? -0.5 : swing * 0.8;
  o.body.position.y = (sit ? 0.06 : 0) + (e.moving ? Math.abs(Math.sin(o.phase)) * 0.07 : Math.sin(time * 2.5 + (e.seed || 0)) * 0.012);

function syncScene(dt) {

    popScale(ob);
    const x = X(o.x), z = Z(o.y);
    ob.root.position.set(x, 0, z);
    const f = 0.85 + Math.sin(time * 13 + x) * 0.12 + Math.sin(time * 7.3 + x) * 0.08;
    ob.fire.scale.set(f * 1.1, f * 0.7, 0.4); ob.ember.scale.set(1, f * 0.8, 0.4);
    ob.light.intensity = 1 + f * 0.8;
    for (let i = 0; i < o.stock; i++) pushInst(boxIM, x + (i < 8 ? -0.37 : 0.37), 0.85 + 0.065 + BOX_H * (i % 8), z + 1.25, (i % 3 - 1) * 0.04);

    ovenMats[o.id].visible = true;

  }

  for (const k in stationMats) stationMats[k].visible = false;

    popScale(ob);
    const x = X(o.x), z = Z(o.y);

    if (o.type === 'soda') for (let i = 0; i < o.stock; i++) pushItem('soda', x + 0.95, 0.45 + Math.floor(i / 3) * 0.3, z + (i % 3 - 1) * 0.4);
    else for (let i = 0; i < o.stock; i++) pushItem('cream', x + (Math.floor(i / 4) % 2 ? 0.25 : -0.25), 0.9 + Math.floor(i / 8) * 0.4, z + (i % 4 - 1.5) * 0.36);
    const icon = itemInfo(o.type).icon, oldMat = stationMats[o.id];

      delete stationMats[o.id];
    }
    if (!stationMats[o.id]) {

      stationMats[o.id].userData.icon = icon;
    }

    const pct = Math.round(o.timer / bakeTime(o) * 100);
    label('st' + o.id, x, 2.3, z, o.stock >= stockMax(o) ? '<span class="tag">FULL</span>' : `<div class="bar"><i style="width:${pct}%"></i></div>`);
  }

    setLook(counterTopMat, k.top, sh.m * 0.5, l >= 2 ? 0.3 : 0.78); setLook(counterMat, k.body); setLook(counterPanelMat, k.panel, l >= 5 ? 0.7 : 0, l >= 5 ? 0.3 : 0.78);

  if (L.soda > 15) label('csoda', X(704), 2.75, cz, `<span class="tag">${itemInfo('soda').icon}×${L.soda}</span>`);
  if (L.cream > 15) label('ccream', X(776), 3.25, cz, `<span class="tag">🍦×${L.cream}</span>`);

    else if (c.patience < PATIENCE * 0.35) label('mad' + c.id, X(c.x), 2.3, Z(c.y), '<div class="icon">😠</div>');
  }
  for (const c of walkers) if (c.angry) label('mad' + c.id, X(c.x), 2.3, Z(c.y), '<div class="icon">😡</div>');
  const fc = carQueue[0];
  if (fc && fc.y === CAR_Y) label('car' + fc.id, X(fc.x) + 0.6, 2.1, Z(fc.y), orderHtml(fc));

  const gt = guideTarget();
  arrow.visible = !!gt && dist(player, gt) > 40;
  if (gt) { arrow.position.set(X(gt.x), 1.6 + Math.abs(Math.sin(time * 4)) * 0.45, Z(gt.y)); arrow.rotation.y += dt * 2.5; }
  floorArrow.visible = !!gt && dist(player, gt) > 120;
  if (floorArrow.visible) {
    const dx = gt.x - player.x, dy = gt.y - player.y, d = Math.hypot(dx, dy), r = 1.05 + Math.sin(time * 6) * 0.08;
    floorArrow.position.set(X(player.x) + dx / d * r, 0.02, Z(player.y) + dy / d * r);
    floorArrow.rotation.y = Math.atan2(-dx, -dy);
  }

  // effects
  for (const e of fx) {
    const t = clamp(e.age / e.life, 0, 1);
    if (e.k === 't') {
      const el = label('fx' + e.id, X(e.x), 2.3 + t * 1.2, Z(e.y), `<span class="float ${e.cls}">${e.t}</span>`);
      el.style.opacity = (1 - t * t).toFixed(2);
    } else if (e.k === 'c' && e.age >= 0) {
      const x = lerp(e.x0, e.tgt.x, t), y = lerp(e.y0, e.tgt.y, t);
      pushInst(coinIM, X(x), 0.6 + t * 0.8 + Math.sin(t * Math.PI) * 1.4, Z(y), 0, Math.PI / 2 * 0.6, time * 10);
    } else if (e.k === 'p') {
      pushInst(confIM, e.px, e.py, e.pz, e.r + e.age * 6, e.r * 2 + e.age * 8, 0);
      confIM.setColorAt(confIM.count - 1, tmpC.set(e.c));
    }
  }

  for (const im of [boxIM, billIM, coinIM, confIM, cupIM, coneIM, scoopIM]) im.instanceMatrix.needsUpdate = true;
  if (confIM.instanceColor) confIM.instanceColor.needsUpdate = true;

  // remove objects whose entity is gone
  for (const [e, o] of objs) if (o.seen !== syncFrame) { scene.remove(o.root); objs.delete(e); }
  firstSync = false;
}

function orderHtml(c) {
  const parts = ITEM_TYPES.filter(t => c.order[t] > 0).map(t => `${itemInfo(t).icon} ${c.got[t]}/${c.order[t]}`);
  let bar = '';
  if (c.patience !== undefined) {
    const p = clamp(c.patience / (c.vip ? VIP_PATIENCE : PATIENCE), 0, 1);
    const color = p > 0.5 ? '#38c979' : p > 0.25 ? '#f7a531' : '#ef5b5b';
    bar = `<div class="pat"><i style="width:${Math.round(p * 100)}%;background:${color}"></i></div>`;
  }
  return `<div class="bubble${c.vip ? ' vip' : ''}">${c.vip ? '👑 ' : ''}${partySize(c) > 1 ? `👥${partySize(c)} · ` : ''}${parts.join(' &nbsp;')}${bar}</div>`;
}

function guideTarget() {
  if (L.unlocked.carrier1) return null;
  if (player.items.length) return DROP;
  if (queue[0] && L.counter > 0) return CASHIER;
  if (L.piles.main > 0) return PILES.main;
  const z = visibleZones().find(d => S.money >= zoneCost(d) - (L.paid[d.id] || 0));
  if (z) return z;
  return pickPt(ovens.reduce((b, o) => o.stock > b.stock ? o : b, ovens[0]));
}

// ================= HUD & panel =================
const moneyEl = document.getElementById('moneyVal');
const upBtn = document.getElementById('upBtn'), soundBtn = document.getElementById('soundBtn');
const panel = document.getElementById('panel'), upList = document.getElementById('upList');
const autoEnabled = document.getElementById('autoEnabled'), autoReserve = document.getElementById('autoReserve');
const autoStatus = document.getElementById('autoStatus');
function saveAutoControls() {
  if (!autoReserve.value.trim() || !setAutoSettings(autoEnabled.checked, Number(autoReserve.value))) {
    toast('Enter a cash reserve as a whole number, zero or more.');
    autoReserve.value = L.auto.reserve;
  }
  refreshPanel();
}
autoEnabled.addEventListener('change', saveAutoControls);
autoReserve.addEventListener('change', saveAutoControls);
let shownMoney = -1;

upList.innerHTML = UPGRADES.map(u => `
  <div class="row" data-id="${u.id}">
    <div class="ic">${u.icon}</div>
    <div class="tx"><div class="nm"></div><div class="ds"></div><div class="pips"></div></div>
    <button data-id="${u.id}"></button>
  </div>`).join('');
upList.addEventListener('click', e => { const id = e.target.closest('button')?.dataset.id; if (id) buyUpgrade(id); });

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!canBuy(u)) return;
  S.money -= upCost(u); L.up[id]++;
  sfx.up(); refreshPanel(); save();
}
function refreshPanel() {
  for (const u of UPGRADES) {
    const row = upList.querySelector(`.row[data-id="${u.id}"]`), l = L.up[u.id];
    row.querySelector('.nm').textContent = u.name;
    row.querySelector('.ds').textContent = l >= u.max ? u.desc(l) : `${u.desc(l)}  →  ${u.next(l)}`;
    const pips = row.querySelector('.pips');
    const html = Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
    if (pips._html !== html) { pips.innerHTML = html; pips._html = html; }
    const b = row.querySelector('button');
    if (upLocked(u)) { b.textContent = 'Need cashier'; b.disabled = true; }
    else if (l >= u.max) { b.textContent = 'MAX'; b.disabled = true; }
    else { b.textContent = '$' + fmt(upCost(u)); b.disabled = S.money < upCost(u); }
  }
  const hired = !!L.unlocked.manager;
  autoEnabled.disabled = autoReserve.disabled = !hired;
  autoEnabled.checked = L.auto.enabled;
  if (document.activeElement !== autoReserve) autoReserve.value = L.auto.reserve;
  const remaining = equipment().some(e => lvOf(e.id) < EQUIP_MAX);
  autoStatus.textContent = !hired ? 'Hire a Manager to enable this.' : !L.auto.enabled ? 'Off. Your manager still collects cash.'
    : !remaining ? 'All current equipment is at its maximum level.'
    : `On. Keeps $${fmt(L.auto.reserve)} in shared cash. Active shop only.`;
}
function togglePanel(open = panel.hidden) {
  panel.hidden = !open;
  if (open) { shopsPanel.hidden = true; refreshPanel(); }
}

const shopsPanel = document.getElementById('shops'), shopList = document.getElementById('shopList');
function refreshShops() {
  const html = LOCATIONS.map((lc, i) => {
    const owned = i < S.shops.length, next = i === S.shops.length, known = owned || next;
    let info, btn = '<button disabled>Locked</button>';
    if (owned) {
      const sh = S.shops[i], done = UNLOCKS.filter(d => sh.unlocked[d.id]).length;
      info = `${done}/${UNLOCKS.length} unlocked · ` + (i === S.cur ? 'you are here' : `earning $${fmt(idleRateFor(sh, i))}/s`);
      btn = i === S.cur ? '<button disabled>Here</button>' : `<button data-shop="${i}">Go</button>`;
    } else if (next) {
      info = `Unlock core equipment and staff in ${LOCATIONS[i - 1].name}, then pay $${fmt(NEXT_SHOP_COST * lc.costMult)}. Extra sales and restocking staff are optional.`;
    } else info = 'Open more shops to find out';
    return `<div class="row"><div class="ic">${known ? lc.icon : '❔'}</div>
      <div class="tx"><div class="nm">${known ? lc.name : '???'}</div><div class="ds">${info}</div>
      ${known ? `<div class="ds">Pizza prices ×${lc.priceMult}</div><div class="ds"><b>${lc.special.title}</b> · ${lc.special.desc}</div>` : ''}</div>${btn}</div>`;
  }).join('') + franchiseHtml();
  if (shopList._html !== html) { shopList.innerHTML = html; shopList._html = html; }
}
shopList.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.sell) { toggleShops(false); sellFranchise(); }
  else if (b.dataset.shop !== undefined) { toggleShops(false); goToShop(+b.dataset.shop); }
});
function franchiseHtml() {
  const n = starsToGain(), can = S.shops.length >= 2 && n >= 1;
  const why = S.shops.length < 2 ? ' · open a second shop first'
    : n < 1 ? ` · earn $${fmt(200000 - S.runEarned)} more` : '';
  return `<div class="row"><div class="ic">🏆</div><div class="tx"><div class="nm">Sell Franchise</div>
    <div class="ds">Reset all shops and money for ${n} 🏆. Each 🏆 adds +10% income forever.</div>
    <div class="ds">You have ${S.stars} 🏆 (+${S.stars * 10}%)${why}</div></div>
    <button data-sell="1" ${can ? '' : 'disabled'}>Sell</button></div>`;
}
function toggleShops(open = shopsPanel.hidden) {
  shopsPanel.hidden = !open;
  if (open) { panel.hidden = true; refreshShops(); }
}
document.getElementById('shopsBtn').onclick = () => { initAudio(); toggleShops(); };
document.getElementById('shopsClose').onclick = () => toggleShops(false);
shopsPanel.addEventListener('pointerdown', e => { if (e.target === shopsPanel) toggleShops(false); });
function toggleSound() { S.sound = !S.sound; soundBtn.textContent = S.sound ? '🔊' : '🔇'; save(); }
upBtn.onclick = () => { initAudio(); togglePanel(); };
soundBtn.onclick = () => { initAudio(); toggleSound(); };
document.getElementById('zoomBtn').onclick = () => { cam.zoom = cam.zoom > 1.3 ? 1 : 1.75; S.zoom = cam.zoom; };
document.getElementById('closeBtn').onclick = () => togglePanel(false);
panel.addEventListener('pointerdown', e => { if (e.target === panel) togglePanel(false); });
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('Reset all progress?')) return;
  S = freshState(); save(); location.reload();
};
soundBtn.textContent = S.sound ? '🔊' : '🔇';

let panelT = 0;
const shopTag = document.getElementById('shopTag'), goalTag = document.getElementById('goalTag'), eventTag = document.getElementById('eventTag');
let badgeT = 0, lastBadge = null;
function hud(dt) {
  const m = Math.floor(S.money);
  if (m !== shownMoney) { moneyEl.textContent = fmt(m); shownMoney = m; }
  const bg = otherShopsRate();
  const tag = `${loc().icon} ${loc().name} · ⭐ ${L.rating.toFixed(1)}` + (S.stars ? ` · 🏆 ${S.stars}` : '') +
    (bg > 0 ? ` · +$${fmt(bg)}/s from other shops` : '');
  if (shopTag.textContent !== tag) shopTag.textContent = tag;
  const g = L.goal;
  const goal = g ? `🎯 ${GOAL_TEXT[g.type](g.target)} · ${fmt(Math.min(g.progress, g.target))}/${fmt(g.target)} · 💵 $${fmt(g.reward)}` : '';
  if (goalTag.textContent !== goal) goalTag.textContent = goal;
  const ev = rushLeft > 0 ? `🔥 ${loc().special.rushEvery ? 'Lunch rush' : 'Rush hour'} · ${Math.ceil(rushLeft)}s`
    : loc().special.rushEvery && L.unlocked.cashier ? `🏙️ Lunch rush in ${Math.ceil(rushT)}s` : '';
  if (eventTag.textContent !== ev) eventTag.textContent = ev;
  // Dock badge (macOS app): show cash waiting while the window is in the background.
  badgeT -= dt;
  if (badgeT <= 0) {
    badgeT = 2;
    const cash = L.piles.main + L.piles.drive;
    const b = !document.hasFocus() && cash >= 1 ? '$' + fmt(cash) : '';
    if (b !== lastBadge) { lastBadge = b; try { window.webkit.messageHandlers.badge.postMessage(b); } catch (e) {} }
  }
  upBtn.classList.toggle('glow', UPGRADES.some(canBuy));
  panelT -= dt;
  if (panelT <= 0) {
    panelT = 0.25;
    if (!panel.hidden) refreshPanel();
    if (!shopsPanel.hidden) refreshShops();
  }
}

// ================= main loop =================
if (!L.goal) newGoal();
if (S.t && Date.now() - S.t > 30000) creditAway((Date.now() - S.t) / 1000);
else if (!S.earned) toast('🍕 Grab pizzas at the oven, drop them on the counter, stand at SERVE, then collect the cash!', 7);

function renderFrame(dt) {
  updateCamera(dt);
  syncScene(dt);
  renderer.render(scene, camera);
  sweepLabels();
}

let last = performance.now(), saveT = 0, skip = 0, pendingDt = 0;
function frame(now) {
  // rAF timestamps can be slightly older than the last performance.now() call.
  let gap = Math.max(0, (now - last) / 1000); last = now;
  // A long gap means the window was hidden or throttled: pay idle income instead of simulating.
  if (gap > 5) { creditAway(gap); gap = 0; }
  const dt = Math.min(gap, 0.05);
  update(dt); hud(dt);
  // Draw at half rate while the window is in the background to save battery.
  pendingDt += dt;
  if (document.hasFocus() || ++skip % 2 === 0) { renderFrame(pendingDt); pendingDt = 0; }
  saveT += dt;
  if (saveT > 3) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// Test hook for automated checks.
window.__game = { get S() { return S; }, get L() { return L; }, goToShop, upgradeEquip, nearestEquip, equipCost, stations, sellFranchise, starsToGain, get rushLeft() { return rushLeft; }, buyUpgrade, UPGRADES, zoneCost, visibleZones, player, queue, walkers, ovens, tables, workers, carQueue, update,
  renderFrame, idleRate, unlock, UNLOCKS, cam, renderer };
</script>
</body>
</html>
