<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Ready (No Ads)</title>
<style>
  html,body{margin:0;height:100%;background:#2b1d14;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;color:#fff}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:10px;left:12px;right:12px;display:flex;
    justify-content:space-between;align-items:center;pointer-events:none}
  #money{background:rgba(0,0,0,.55);padding:6px 16px;border-radius:22px;
    font-size:24px;font-weight:800;letter-spacing:.5px}
  #right{display:flex;gap:8px;pointer-events:auto}
  button{font:inherit;cursor:pointer;border:0;border-radius:18px;
    padding:7px 14px;font-weight:700;background:#fdcb6e;color:#3d2a12}
  button:disabled{background:#7f7f7f;color:#ddd;cursor:default}
  #soundBtn{background:rgba(0,0,0,.55);color:#fff}
  #upBtn.glow{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 0 0 #ffeaa7}to{box-shadow:0 0 14px 4px #ffeaa7}}
  kbd{font-size:11px;background:rgba(0,0,0,.15);padding:1px 5px;border-radius:4px}
  #help{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;
    color:rgba(255,255,255,.75);pointer-events:none;text-shadow:0 1px 2px #000}
  #panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
    align-items:center;justify-content:center}
  #panel[hidden]{display:none}
  #card{background:#3d2a1e;border:3px solid #fdcb6e;border-radius:18px;padding:16px 18px;
    width:min(520px,92vw);max-height:86vh;overflow:auto;box-shadow:0 10px 40px #000}
  #card h2{margin:0 0 10px;font-size:22px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
  .row .ic{font-size:28px;width:36px;text-align:center}
  .row .tx{flex:1}
  .row .nm{font-weight:800}
  .row .ds{font-size:12px;opacity:.8}
  .row button{min-width:92px}
  #cardFoot{display:flex;justify-content:space-between;margin-top:12px}
  #resetBtn{background:#636e72;color:#fff;font-size:12px}
  #toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.75);padding:10px 18px;border-radius:14px;font-weight:700;
    font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:80vw}
  #toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="money">💵 <span id="moneyVal">0</span></div>
  <div id="right">
    <button id="soundBtn" title="Sound (M)">🔊</button>
    <button id="upBtn">⬆️ Upgrades <kbd>U</kbd></button>
  </div>
</div>
<div id="help">WASD / Arrows / click-and-hold to move · Walk onto ovens, counters, cash and $ zones · U upgrades · M sound</div>
<div id="panel" hidden>
  <div id="card">
    <h2>⬆️ Upgrades</h2>
    <div id="upList"></div>
    <div id="cardFoot">
      <button id="resetBtn">Reset progress</button>
      <button id="closeBtn">Close <kbd>Esc</kbd></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
// ================= canvas & helpers =================
const W = 1200, H = 800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1, time = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2;
  offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (x, y) => ({ x, y });

function moveTo(e, tx, ty, sp, dt) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= sp * dt || d < 0.5) { e.x = tx; e.y = ty; e.moving = false; return true; }
  e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
  e.dir = Math.atan2(dy, dx); e.moving = true;
  return false;
}
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e4) return '' + n;
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  return (n / 1e9).toFixed(2) + 'B';
}
function fmtDur(s) {
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + ' min';
  return (s / 3600).toFixed(1) + ' h';
}

// ================= layout =================
const ROOM = { x: 90, y: 40, w: 1100, h: 730 };
const COUNTER = { x: 540, y: 305, w: 260, h: 48 };
const DROP = P(600, 268), CASHIER = P(740, 268);
const DRIVE_COUNTER = { x: 92, y: 480, w: 46, h: 170 };
const DRIVE_DROP = P(172, 512), DRIVE_CASHIER = P(172, 618);
const QUEUE_X = 740, QUEUE_Y = 398, QUEUE_GAP = 44, MAX_QUEUE = 8;
const LEAVE_X = 805, AISLE_X = 880, DOOR_X = 780, SPAWN = P(740, 850);
const CAR_X = 42, CAR_Y = 590, CAR_GAP = 100;
const PILES = { main: P(850, 272), drive: P(230, 730) };
const COUNTER_MAX = 40, DRIVE_MAX = 30;
const OVEN_POS = { oven1: P(170, 95), oven2: P(300, 95), oven3: P(430, 95), oven4: P(560, 95) };
const TABLE_POS = {
  table1: P(980, 170), table2: P(1110, 170), table3: P(980, 370),
  table4: P(1110, 370), table5: P(980, 570), table6: P(1110, 570),
};
const WORKER_POST_IDLE = { carrier: P(470, 200), cleaner: P(1045, 720) };

const UNLOCKS = [
  { id: 'table1',   cost: 20,   req: null,       x: 980,  y: 170, icon: '🪑', name: 'Table' },
  { id: 'oven2',    cost: 50,   req: 'table1',   x: 300,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'cashier',  cost: 100,  req: 'oven2',    x: 740,  y: 185, icon: '💁', name: 'Hire Cashier' },
  { id: 'table2',   cost: 120,  req: 'cashier',  x: 1110, y: 170, icon: '🪑', name: 'Table' },
  { id: 'carrier1', cost: 200,  req: 'cashier',  x: 470,  y: 260, icon: '🧑‍🍳', name: 'Hire Baker' },
  { id: 'table3',   cost: 260,  req: 'table2',   x: 980,  y: 370, icon: '🪑', name: 'Table' },
  { id: 'oven3',    cost: 350,  req: 'carrier1', x: 430,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'cleaner',  cost: 500,  req: 'table3',   x: 1045, y: 700, icon: '🧹', name: 'Hire Cleaner' },
  { id: 'table4',   cost: 600,  req: 'table3',   x: 1110, y: 370, icon: '🪑', name: 'Table' },
  { id: 'drive',    cost: 900,  req: 'oven3',    x: 175,  y: 565, icon: '🚗', name: 'Drive-Thru' },
  { id: 'driver',   cost: 1200, req: 'drive',    x: 260,  y: 640, icon: '🎧', name: 'Hire Drive Clerk' },
  { id: 'table5',   cost: 1400, req: 'table4',   x: 980,  y: 570, icon: '🪑', name: 'Table' },
  { id: 'carrier2', cost: 1600, req: 'drive',    x: 380,  y: 260, icon: '🧑‍🍳', name: 'Hire Baker' },
  { id: 'table6',   cost: 2000, req: 'table5',   x: 1110, y: 570, icon: '🪑', name: 'Table' },
  { id: 'oven4',    cost: 2500, req: 'carrier2', x: 560,  y: 95,  icon: '🔥', name: 'Oven' },
];

// ================= upgrades =================
const playerSpeed = l => 170 + 22 * l;
const carryCap = l => 4 + 2 * l;
const ovenTime = l => 3 * Math.pow(0.86, l);
const ovenMax = l => 6 + l;
const pizzaPrice = l => 5 + 3 * l;
const staffSpeed = l => 120 + 18 * l;
const staffCap = l => 3 + l;
const spawnTimeFor = l => 4.5 * Math.pow(0.88, l);

const UPGRADES = [
  { id: 'speed', icon: '👟', name: 'Running Shoes', max: 8, base: 30, mult: 1.7,
    desc: l => `Speed ${playerSpeed(l)}`, next: l => `${playerSpeed(l + 1)}` },
  { id: 'cap', icon: '💪', name: 'Bigger Arms', max: 8, base: 40, mult: 1.75,
    desc: l => `Carry ${carryCap(l)} pizzas`, next: l => `${carryCap(l + 1)}` },
  { id: 'oven', icon: '🔥', name: 'Hotter Ovens', max: 10, base: 60, mult: 1.7,
    desc: l => `Bake ${ovenTime(l).toFixed(1)}s, hold ${ovenMax(l)}`,
    next: l => `${ovenTime(l + 1).toFixed(1)}s, ${ovenMax(l + 1)}` },
  { id: 'price', icon: '🍕', name: 'Better Recipe', max: 25, base: 80, mult: 1.4,
    desc: l => `Pizza sells for $${pizzaPrice(l)}`, next: l => `$${pizzaPrice(l + 1)}` },
  { id: 'cust', icon: '📣', name: 'Word of Mouth', max: 8, base: 120, mult: 1.8,
    desc: l => `Customer every ${spawnTimeFor(l).toFixed(1)}s`, next: l => `${spawnTimeFor(l + 1).toFixed(1)}s` },
  { id: 'staff', icon: '🎓', name: 'Staff Training', max: 6, base: 250, mult: 1.9, req: 'cashier',
    desc: l => `Staff speed ${staffSpeed(l)}, carry ${staffCap(l)}`,
    next: l => `${staffSpeed(l + 1)}, ${staffCap(l + 1)}` },
];
const upCost = u => Math.round(u.base * Math.pow(u.mult, S.up[u.id]));
const upLocked = u => u.req && !S.unlocked[u.req];
const canBuy = u => !upLocked(u) && S.up[u.id] < u.max && S.money >= upCost(u);

// ================= save state =================
const SAVE_KEY = 'pizza-ready-noads-v1';
function freshState() {
  return {
    money: 0, unlocked: { oven1: true }, paid: {},
    up: { speed: 0, cap: 0, oven: 0, price: 0, cust: 0, staff: 0 },
    counter: 0, drive: 0, piles: { main: 0, drive: 0 },
    earned: 0, sound: true, t: 0,
  };
}
function loadState() {
  const s = freshState();
  let raw = null;
  try { raw = window.__SAVE__ || localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (!raw) return s;
  try {
    const d = JSON.parse(raw);
    Object.assign(s, d);
    s.up = Object.assign(freshState().up, d.up || {});
    s.piles = Object.assign({ main: 0, drive: 0 }, d.piles || {});
    s.unlocked = Object.assign({ oven1: true }, d.unlocked || {});
    s.paid = d.paid || {};
  } catch (e) {}
  return s;
}
let S = loadState();
function save() {
  S.t = Date.now();
  const data = JSON.stringify(S);
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
  // The macOS wrapper app stores the save in Application Support.
  try { window.webkit.messageHandlers.save.postMessage(data); } catch (e) {}
}

// ================= world =================
const player = { x: 600, y: 210, dir: Math.PI / 2, moving: false, stack: 0, actT: 0, seed: 0 };
const ovens = [], tables = [], workers = [], queue = [], walkers = [], carQueue = [], carsOut = [];
const zoneStand = {};
let spawnT = 1.5, carT = 4, serveT = 0, driveServeT = 0;

const SHIRTS = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#ff6fa5', '#34495e'];
const SKINS = ['#f5d0b5', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'];
const HAIRS = ['#2c1b10', '#5a3825', '#b8860b', '#111', '#a0522d', '#ddd'];
const CAR_COLORS = ['#e74c3c', '#2980b9', '#f39c12', '#8e44ad', '#16a085', '#ecf0f1', '#2c3e50'];
const WORKER_LOOK = {
  cashier: { shirt: '#0984e3', hat: 'cap', hatColor: '#74b9ff' },
  carrier: { shirt: '#e17055', hat: 'chef' },
  cleaner: { shirt: '#00b894', hat: 'cap', hatColor: '#55efc4' },
  driver:  { shirt: '#6c5ce7', hat: 'cap', hatColor: '#a29bfe' },
};

function makeWorker(id) {
  const type = id.startsWith('carrier') ? 'carrier' : id;
  return {
    id, type, x: DOOR_X, y: 760, dir: -Math.PI / 2, moving: false, stack: 0, actT: 0,
    state: 'fetch', oven: null, dest: 'counter', table: null,
    off: id === 'carrier2' ? 24 : 0, seed: Math.random() * 10,
    skin: pick(SKINS), ...WORKER_LOOK[type],
  };
}
function syncWorld() {
  for (const id in OVEN_POS)
    if (S.unlocked[id] && !ovens.some(o => o.id === id)) ovens.push({ id, ...OVEN_POS[id], stock: 0, timer: 0 });
  for (const id in TABLE_POS)
    if (S.unlocked[id] && !tables.some(t => t.id === id))
      tables.push({ id, ...TABLE_POS[id], occupant: null, dirty: false, tip: 0, clean: 0 });
  for (const id of ['cashier', 'carrier1', 'carrier2', 'cleaner', 'driver'])
    if (S.unlocked[id] && !workers.some(w => w.id === id)) workers.push(makeWorker(id));
}
syncWorld();

const pickPt = o => P(o.x, o.y + 80);
const price = () => pizzaPrice(S.up.price);
const spawnTime = () => spawnTimeFor(S.up.cust) / (1 + 0.15 * (ovens.length - 1));
const carTime = () => 11 * Math.pow(0.9, S.up.cust);
const visibleZones = () => UNLOCKS.filter(d => !S.unlocked[d.id] && (!d.req || S.unlocked[d.req]));
const workerAt = (type, pt) => workers.some(w => w.type === type && dist(w, pt) < 6);
const cashierPresent = () => dist(player, CASHIER) < 42 || workerAt('cashier', CASHIER);
const drivePresent = () => S.unlocked.drive && (dist(player, DRIVE_CASHIER) < 42 || workerAt('driver', DRIVE_CASHIER));

function obstacles() {
  const r = [COUNTER];
  for (const o of ovens) r.push({ x: o.x - 50, y: o.y - 35, w: 100, h: 88 });
  for (const t of tables) r.push({ x: t.x - 40, y: t.y - 25, w: 80, h: 48 });
  if (S.unlocked.drive) r.push(DRIVE_COUNTER);
  return r;
}
function pushOut(e, r, rad) {
  const cx = clamp(e.x, r.x, r.x + r.w), cy = clamp(e.y, r.y, r.y + r.h);
  const dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
  if (d > 0 && d < rad) { e.x = cx + dx / d * rad; e.y = cy + dy / d * rad; return; }
  if (d === 0) { // center inside the box: push out along the shortest axis
    const l = e.x - r.x, rt = r.x + r.w - e.x, t = e.y - r.y, b = r.y + r.h - e.y;
    const m = Math.min(l, rt, t, b);
    if (m === l) e.x = r.x - rad; else if (m === rt) e.x = r.x + r.w + rad;
    else if (m === t) e.y = r.y - rad; else e.y = r.y + r.h + rad;
  }
}

// ================= input =================
const keys = {};
const pointer = { down: false, x: 0, y: 0 };
const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyU', 'KeyM', 'Escape'];
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyU') togglePanel();
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'Escape') togglePanel(false);
});
addEventListener('keyup', e => { keys[e.code] = false; if (GAME_KEYS.includes(e.code)) e.preventDefault(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });
function setPointer(e) { pointer.x = (e.clientX * dpr - offX) / scale; pointer.y = (e.clientY * dpr - offY) / scale; }
cv.addEventListener('pointerdown', e => { pointer.down = true; setPointer(e); initAudio(); });
addEventListener('pointermove', e => { if (pointer.down) setPointer(e); });
addEventListener('pointerup', () => { pointer.down = false; });

// ================= audio =================
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = 0.04, delay = 0) {
  if (!S.sound || !AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  pop: () => tone(520 + Math.random() * 120, 0.05, 'sine', 0.02),
  cash: () => { tone(1320, 0.08, 'square', 0.02); tone(1760, 0.12, 'square', 0.02, 0.06); },
  unlock: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.05, i * 0.08)),
  up: () => { tone(660, 0.1, 'triangle', 0.05); tone(990, 0.15, 'triangle', 0.05, 0.08); },
};

// ================= effects =================
const fx = [];
function addFloat(x, y, t, c = '#fff') { fx.push({ k: 't', x, y, t, c, age: 0, life: 1.2 }); }
function addCoins(x, y, tgt, n) {
  for (let i = 0; i < n; i++) fx.push({ k: 'c', x0: x + rand(-10, 10), y0: y + rand(-10, 10), tgt, age: -i * 0.04, life: 0.45 });
}
function confetti(x, y) {
  for (let i = 0; i < 40; i++)
    fx.push({ k: 'p', x, y, vx: rand(-220, 220), vy: rand(-380, -120), c: pick(SHIRTS), age: 0, life: 1.3 });
}
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, sec = 3.5) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), sec * 1000);
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt;
    if (f.k === 't') f.y -= 40 * dt;
    if (f.k === 'p') { f.vy += 700 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    if (f.age >= f.life) fx.splice(i, 1);
  }
}

// ================= update =================
function earn(amt, x, y) {
  S.money += amt; S.earned += amt;
  addFloat(x, y - 70, '+$' + fmt(amt), '#55efc4');
}

function updatePlayer(dt) {
  let vx = 0, vy = 0;
  if (keys.KeyW || keys.ArrowUp) vy--;
  if (keys.KeyS || keys.ArrowDown) vy++;
  if (keys.KeyA || keys.ArrowLeft) vx--;
  if (keys.KeyD || keys.ArrowRight) vx++;
  if (!vx && !vy && pointer.down) {
    const dx = pointer.x - player.x, dy = pointer.y - player.y, d = Math.hypot(dx, dy);
    if (d > 8) { vx = dx / d; vy = dy / d; }
  }
  const m = Math.hypot(vx, vy);
  if (m > 0) {
    const sp = playerSpeed(S.up.speed);
    player.x += vx / m * sp * dt; player.y += vy / m * sp * dt;
    player.dir = Math.atan2(vy, vx); player.moving = true;
  } else player.moving = false;
  player.x = clamp(player.x, ROOM.x + 14, ROOM.x + ROOM.w - 14);
  player.y = clamp(player.y, ROOM.y + 14, ROOM.y + ROOM.h - 14);
  for (const r of obstacles()) pushOut(player, r, 14);

  // pick up, drop off
  player.actT -= dt;
  const cap = carryCap(S.up.cap);
  if (player.actT <= 0) {
    for (const o of ovens) {
      if (o.stock > 0 && player.stack < cap && dist(player, pickPt(o)) < 50) {
        o.stock--; player.stack++; player.actT = 0.1; sfx.pop(); break;
      }
    }
  }
  if (player.actT <= 0 && player.stack > 0) {
    if (dist(player, DROP) < 50 && S.counter < COUNTER_MAX) {
      S.counter++; player.stack--; player.actT = 0.07; sfx.pop();
    } else if (S.unlocked.drive && dist(player, DRIVE_DROP) < 50 && S.drive < DRIVE_MAX) {
      S.drive++; player.stack--; player.actT = 0.07; sfx.pop();
    }
  }
  // collect cash
  for (const k in PILES) {
    if (S.piles[k] > 0 && dist(player, PILES[k]) < 50) {
      const amt = S.piles[k]; S.piles[k] = 0;
      earn(amt, player.x, player.y);
      addCoins(PILES[k].x, PILES[k].y - 10, player, Math.min(12, 3 + Math.floor(amt / 20)));
      sfx.cash();
    }
  }
  // clean tables
  for (const t of tables) {
    if (t.dirty && dist(player, t) < 75) {
      t.clean += dt * 1.6;
      if (t.clean >= 1) cleanTable(t, true);
    }
  }
}

function cleanTable(t, byPlayer) {
  if (byPlayer) { earn(t.tip, t.x, t.y); sfx.cash(); }
  else S.piles.main += t.tip;
  t.dirty = false; t.clean = 0; t.tip = 0;
}

function updateOvens(dt) {
  const max = ovenMax(S.up.oven), bake = ovenTime(S.up.oven);
  for (const o of ovens) {
    if (o.stock >= max) { o.timer = 0; continue; }
    o.timer += dt;
    if (o.timer >= bake) { o.timer = 0; o.stock++; }
  }
}

function updateWorkers(dt) {
  const sp = staffSpeed(S.up.staff);
  for (const w of workers) {
    w.actT -= dt;
    if (w.type === 'cashier') moveTo(w, CASHIER.x, CASHIER.y, sp, dt);
    else if (w.type === 'driver') moveTo(w, DRIVE_CASHIER.x, DRIVE_CASHIER.y, sp, dt);
    else if (w.type === 'carrier') updateCarrier(w, sp, dt);
    else if (w.type === 'cleaner') updateCleaner(w, sp, dt);
  }
}

function updateCarrier(w, sp, dt) {
  const cap = staffCap(S.up.staff);
  const anyStock = ovens.some(o => o.stock > 0);
  if (w.state === 'fetch') {
    if (w.stack >= cap || (w.stack > 0 && !anyStock)) {
      w.state = 'deliver';
      w.dest = S.unlocked.drive && S.drive < S.counter ? 'drive' : 'counter';
      return;
    }
    if (!w.oven || (w.oven.stock === 0 && anyStock))
      w.oven = ovens.reduce((b, o) => (o.stock > b.stock || (o.stock === b.stock && o.timer > b.timer)) ? o : b, ovens[0]);
    const p = pickPt(w.oven);
    if (moveTo(w, p.x + w.off, p.y, sp, dt) && w.oven.stock > 0 && w.actT <= 0) {
      w.oven.stock--; w.stack++; w.actT = 0.18;
    }
  } else {
    const d = w.dest === 'drive' ? DRIVE_DROP : DROP;
    if (moveTo(w, d.x + w.off, d.y, sp, dt) && w.actT <= 0) {
      if (w.dest === 'drive' && S.drive < DRIVE_MAX) { S.drive++; w.stack--; w.actT = 0.1; }
      else if (w.dest === 'counter' && S.counter < COUNTER_MAX) { S.counter++; w.stack--; w.actT = 0.1; }
      if (w.stack <= 0) { w.stack = 0; w.state = 'fetch'; w.oven = null; }
    }
  }
}

function updateCleaner(w, sp, dt) {
  if (!w.table || !w.table.dirty) w.table = tables.find(t => t.dirty) || null;
  if (!w.table) { const p = WORKER_POST_IDLE.cleaner; moveTo(w, p.x, p.y, sp, dt); return; }
  const t = w.table;
  if (moveTo(w, t.x, t.y + 45, sp, dt)) {
    t.clean += dt;
    if (t.clean >= 1) { cleanTable(t, false); w.table = null; }
  }
}

function spawnCustomer() {
  const c = {
    x: SPAWN.x + rand(-8, 8), y: SPAWN.y, dir: -Math.PI / 2, moving: true,
    order: randi(1, 3), got: 0, stack: 0, dine: Math.random() < 0.65,
    state: 'queue', path: [], next: null, table: null, timer: 0, seed: Math.random() * 10,
    shirt: pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIRS), pants: pick(['#2d3436', '#34495e', '#6d4c41', '#1e3799']),
  };
  queue.push(c);
}

function finishOrder(c) {
  queue.shift();
  const pay = c.order * price();
  S.piles.main += pay;
  addFloat(QUEUE_X, QUEUE_Y - 60, '$' + fmt(pay), '#ffeaa7');
  c.stack = c.order; c.state = 'walk';
  const t = c.dine ? tables.find(t => !t.occupant && !t.dirty) : null;
  if (t) {
    t.occupant = c; c.table = t; c.next = 'eat';
    c.path = [P(AISLE_X, QUEUE_Y), P(AISLE_X, t.y + 45), P(t.x, t.y + 45)];
  } else {
    c.next = 'gone';
    c.path = [P(LEAVE_X, QUEUE_Y + 10), P(LEAVE_X, 860)];
  }
  walkers.push(c);
}

function updateCustomers(dt) {
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = spawnTime() * rand(0.7, 1.3);
    if (queue.length < MAX_QUEUE) spawnCustomer();
  }
  queue.forEach((c, i) => moveTo(c, QUEUE_X, QUEUE_Y + i * QUEUE_GAP, 110, dt));
  const f = queue[0];
  if (f && f.x === QUEUE_X && f.y === QUEUE_Y && cashierPresent()) {
    serveT -= dt;
    if (serveT <= 0 && f.got < f.order && S.counter > 0) { S.counter--; f.got++; serveT = 0.22; }
    if (f.got >= f.order) finishOrder(f);
  }
  for (let i = walkers.length - 1; i >= 0; i--) {
    const c = walkers[i];
    if (c.state === 'eat') {
      c.timer -= dt;
      if (c.timer <= 0) {
        const t = c.table;
        t.occupant = null; t.dirty = true; t.tip = Math.round(price() * c.order * 0.5) + 2;
        c.table = null; c.state = 'walk'; c.next = 'gone';
        c.path = [P(AISLE_X, t.y + 45), P(AISLE_X, 720), P(LEAVE_X, 760), P(LEAVE_X, 860)];
      }
      continue;
    }
    if (c.path.length) { const p = c.path[0]; if (moveTo(c, p.x, p.y, 110, dt)) c.path.shift(); }
    else if (c.next === 'eat') { c.state = 'eat'; c.timer = rand(6, 10); c.eatTotal = c.timer; c.stack = 0; c.dir = -Math.PI / 2; c.moving = false; }
    else walkers.splice(i, 1);
  }
}

function updateCars(dt) {
  if (S.unlocked.drive) {
    carT -= dt;
    if (carT <= 0) {
      carT = carTime() * rand(0.8, 1.2);
      if (carQueue.length < 3) carQueue.push({ x: CAR_X, y: 900, order: randi(3, 6), got: 0, color: pick(CAR_COLORS) });
    }
  }
  carQueue.forEach((c, i) => moveTo(c, CAR_X, CAR_Y + i * CAR_GAP, 170, dt));
  const f = carQueue[0];
  if (f && f.y === CAR_Y && drivePresent()) {
    driveServeT -= dt;
    if (driveServeT <= 0 && f.got < f.order && S.drive > 0) { S.drive--; f.got++; driveServeT = 0.2; }
    if (f.got >= f.order) {
      carQueue.shift(); driveServeT = 0.4;
      const pay = Math.round(f.order * price() * 1.5);
      S.piles.drive += pay;
      addFloat(CAR_X + 40, CAR_Y - 50, '$' + fmt(pay), '#ffeaa7');
      carsOut.push(f);
    }
  }
  for (let i = carsOut.length - 1; i >= 0; i--)
    if (moveTo(carsOut[i], CAR_X, -150, 230, dt)) carsOut.splice(i, 1);
}

function updateZones(dt) {
  for (const d of visibleZones()) {
    const inside = Math.abs(player.x - d.x) < 38 && Math.abs(player.y - d.y) < 38;
    if (!inside) { zoneStand[d.id] = 0; continue; }
    zoneStand[d.id] = (zoneStand[d.id] || 0) + dt;
    if (zoneStand[d.id] < 0.25 || S.money <= 0) continue;
    const paid = S.paid[d.id] || 0;
    const amt = Math.min(Math.max(d.cost / 1.5, 20) * dt, S.money, d.cost - paid);
    S.money -= amt; S.paid[d.id] = paid + amt;
    if (Math.random() < 0.3) fx.push({ k: 'c', x0: player.x, y0: player.y - 30, tgt: P(d.x, d.y + 30), age: 0, life: 0.35 });
    if (S.paid[d.id] >= d.cost - 1e-6) unlock(d);
  }
}

function unlock(d) {
  S.unlocked[d.id] = true; delete S.paid[d.id];
  syncWorld(); confetti(d.x, d.y); sfx.unlock();
  toast(`${d.icon} ${d.name} unlocked!`);
  save();
}

function update(dt) {
  time += dt;
  updatePlayer(dt);
  updateOvens(dt);
  updateWorkers(dt);
  updateCustomers(dt);
  updateCars(dt);
  updateZones(dt);
  updateFx(dt);
}

// Money per second the staff makes while you are away. Needs a cashier and a baker.
function idleRate() {
  if (!S.unlocked.cashier || !S.unlocked.carrier1) return 0;
  const prod = ovens.length / ovenTime(S.up.oven);
  const drive = S.unlocked.drive && S.unlocked.driver ? 4.5 / carTime() : 0;
  const demand = 2 / spawnTime() + drive;
  const carriers = S.unlocked.carrier2 ? 2 : 1;
  const haul = carriers * staffCap(S.up.staff) / 7;
  return Math.min(prod, demand, haul) * price() * 0.5;
}
function creditAway(sec) {
  sec = Math.min(sec, 8 * 3600);
  const amt = Math.floor(idleRate() * sec);
  if (amt > 0) {
    S.money += amt; S.earned += amt; sfx.cash();
    toast(`👋 While you were away (${fmtDur(sec)}), your staff earned $${fmt(amt)}`, 5);
  }
}

const FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
function rr(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function text(t, x, y, size, color = '#fff', stroke = 0, align = 'center') {
  ctx.font = `800 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function bar(x, y, w, frac, color) {
  rr(x - w / 2, y, w, 7, 3, 'rgba(0,0,0,.4)');
  if (frac > 0) rr(x - w / 2, y, w * clamp(frac, 0, 1), 7, 3, color);
}

function drawPerson(e, o) {
  const x = e.x, sit = e.state === 'eat';
  const y = sit ? e.y + 4 : e.y;
  const ph = time * 14 + (e.seed || 0);
  const bob = e.moving ? Math.abs(Math.sin(ph)) * 3 : 0;

    ctx.fillRect(x - 7, y - 12, 5, 11 + sw); ctx.fillRect(x + 2, y - 12, 5, 11 - sw);

  rr(x - 11, y - 34 - bob, 22, 24, 8, o.shirt);

  circ(x, hy, 10, o.skin);
  const facingUp = Math.sin(e.dir) < -0.5;
  if (o.hat === 'chef') {

    circ(x - 5, hy - 14, 6, '#fff'); circ(x + 5, hy - 14, 6, '#fff'); circ(x, hy - 17, 7, '#fff');
  } else if (o.hat === 'cap') {
    ctx.beginPath(); ctx.arc(x, hy - 2, 10, Math.PI, 0); ctx.fillStyle = o.hatColor; ctx.fill();

function drawPile(p, amt) {

  const n = Math.min(27, 1 + Math.floor(amt / 8));
  ell(p.x, p.y + 4, 26, 8, 'rgba(0,0,0,.18)');
  for (let i = 0; i < n; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    rr(p.x - 26 + col * 18, p.y - 4 - row * 5 - (col === 1 ? 3 : 0), 16, 8, 2, '#27ae60', '#1e8449', 1);
  }
  text('$' + fmt(amt), p.x, p.y - 22 - Math.floor((n - 1) / 3) * 5, 13, '#55efc4', 3);
}

function drawCar(c) {
  const { x, y } = c;
  ell(x, y + 36, 26, 8, 'rgba(0,0,0,.25)');
  ctx.fillStyle = '#111';
  for (const dy of [-24, 18]) { ctx.fillRect(x - 25, y + dy, 6, 14); ctx.fillRect(x + 19, y + dy, 6, 14); }
  rr(x - 22, y - 38, 44, 76, 12, c.color, 'rgba(0,0,0,.3)', 1.5);
  rr(x - 17, y - 26, 34, 14, 4, '#a8d8ff');
  rr(x - 17, y + 16, 34, 10, 4, '#a8d8ff');
}

function bubble(x, y, got, order) {
  rr(x - 26, y - 14, 52, 24, 10, '#fff');
  ctx.beginPath(); ctx.moveTo(x - 5, y + 10); ctx.lineTo(x, y + 16); ctx.lineTo(x + 5, y + 10); ctx.fillStyle = '#fff'; ctx.fill();
  text(`🍕${got}/${order}`, x, y - 2, 13, '#2d3436');
}

function guideTarget() {
  if (S.unlocked.carrier1) return null;
  if (player.stack > 0) return DROP;
  if (queue[0] && S.counter > 0) return CASHIER;
  if (S.piles.main > 0) return PILES.main;
  const z = visibleZones().find(d => S.money >= d.cost - (S.paid[d.id] || 0));
  if (z) return z;
  return pickPt(ovens.reduce((b, o) => o.stock > b.stock ? o : b, ovens[0]));
}
function drawArrow(p) {
  if (!p || dist(player, p) < 40) return;
  const y = p.y - 26 + Math.sin(time * 6) * 6;
  ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(p.x - 18, y - 20); ctx.lineTo(p.x - 7, y - 20); ctx.lineTo(p.x - 7, y - 38);
  ctx.lineTo(p.x + 7, y - 38); ctx.lineTo(p.x + 7, y - 20); ctx.lineTo(p.x + 18, y - 20); ctx.closePath();
  ctx.fillStyle = '#00e676'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#1b5e20'; ctx.stroke();
}

function drawFx() {
  for (const f of fx) {
    const t = clamp(f.age / f.life, 0, 1);
    if (f.k === 't') { ctx.globalAlpha = 1 - t; text(f.t, f.x, f.y, 18, f.c, 4); ctx.globalAlpha = 1; }
    else if (f.k === 'c' && f.age >= 0) {
      const x = lerp(f.x0, f.tgt.x, t), y = lerp(f.y0, f.tgt.y - 30, t) - Math.sin(t * Math.PI) * 40;
      circ(x, y, 5, '#f1c40f'); circ(x, y, 3, '#f39c12');
    } else if (f.k === 'p') { ctx.globalAlpha = 1 - t; ctx.fillStyle = f.c; ctx.fillRect(f.x, f.y, 6, 4); ctx.globalAlpha = 1; }
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2b1d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawFloor(); drawRoad(); drawWalls(); drawMats();
  for (const d of visibleZones()) drawZone(d);

  const list = [];
  for (const o of ovens) list.push([o.y + 50, () => drawOven(o)]);
  list.push([COUNTER.y + COUNTER.h, drawCounter]);
  if (S.unlocked.drive) list.push([DRIVE_COUNTER.y + DRIVE_COUNTER.h, drawDriveCounter]);
  for (const t of tables) list.push([t.y + 22, () => drawTable(t)]);
  for (const k in PILES) list.push([PILES[k].y, () => drawPile(PILES[k], S.piles[k])]);
  for (const c of [...queue, ...walkers]) list.push([c.y, () => drawPerson(c, c)]);
  for (const w of workers) list.push([w.y, () => drawPerson(w, w)]);
  list.push([player.y, () => drawPerson(player, { shirt: '#d63031', skin: '#f5d0b5', hat: 'chef', pants: '#2d3436' })]);
  for (const c of [...carQueue, ...carsOut]) list.push([c.y + 38, () => drawCar(c)]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [, draw] of list) draw();

  const f = queue[0];
  if (f && f.y === QUEUE_Y) bubble(f.x, f.y - 72, f.got, f.order);
  const fc = carQueue[0];
  if (fc && fc.y === CAR_Y) bubble(fc.x + 30, fc.y - 52, fc.got, fc.order);
  if (f && f.y === QUEUE_Y && !cashierPresent() && S.counter > 0) text('❗', CASHIER.x, CASHIER.y - 40, 20);
  const cap = carryCap(S.up.cap);
  if (player.stack >= cap) text('MAX', player.x, player.y - 34 - cap * 7, 12, '#ffeaa7', 3);
  drawArrow(guideTarget());
  drawFx();
  ctx.restore();
}

// ================= HUD & panel =================
const moneyEl = document.getElementById('moneyVal');
const upBtn = document.getElementById('upBtn'), soundBtn = document.getElementById('soundBtn');
const panel = document.getElementById('panel'), upList = document.getElementById('upList');
let shownMoney = -1;

upList.innerHTML = UPGRADES.map(u => `
  <div class="row" data-id="${u.id}">
    <div class="ic">${u.icon}</div>
    <div class="tx"><div class="nm"></div><div class="ds"></div></div>
    <button data-id="${u.id}"></button>
  </div>`).join('');
upList.addEventListener('click', e => { const id = e.target.closest('button')?.dataset.id; if (id) buyUpgrade(id); });

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!canBuy(u)) return;
  S.money -= upCost(u); S.up[id]++;
  sfx.up(); refreshPanel(); save();
}
function refreshPanel() {
  for (const u of UPGRADES) {
    const row = upList.querySelector(`.row[data-id="${u.id}"]`), l = S.up[u.id];
    row.querySelector('.nm').textContent = `${u.name}  ·  Lv ${l}/${u.max}`;
    row.querySelector('.ds').textContent = l >= u.max ? u.desc(l) : `${u.desc(l)}  →  ${u.next(l)}`;
    const b = row.querySelector('button');
    if (upLocked(u)) { b.textContent = 'Hire cashier'; b.disabled = true; }
    else if (l >= u.max) { b.textContent = 'MAX'; b.disabled = true; }
    else { b.textContent = '$' + fmt(upCost(u)); b.disabled = S.money < upCost(u); }
  }
}
function togglePanel(open = panel.hidden) {
  panel.hidden = !open;
  if (open) refreshPanel();
}
function toggleSound() { S.sound = !S.sound; soundBtn.textContent = S.sound ? '🔊' : '🔇'; save(); }
upBtn.onclick = () => { initAudio(); togglePanel(); };
soundBtn.onclick = () => { initAudio(); toggleSound(); };
document.getElementById('closeBtn').onclick = () => togglePanel(false);
panel.addEventListener('pointerdown', e => { if (e.target === panel) togglePanel(false); });
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('Reset all progress?')) return;
  S = freshState(); save(); location.reload();
};
soundBtn.textContent = S.sound ? '🔊' : '🔇';

let panelT = 0;
function hud(dt) {
  const m = Math.floor(S.money);
  if (m !== shownMoney) { moneyEl.textContent = fmt(m); shownMoney = m; }
  upBtn.classList.toggle('glow', UPGRADES.some(canBuy));
  panelT -= dt;
  if (!panel.hidden && panelT <= 0) { panelT = 0.25; refreshPanel(); }
}

// ================= main loop =================
if (S.t && Date.now() - S.t > 30000) creditAway((Date.now() - S.t) / 1000);
else if (!S.earned) toast('🍕 Grab pizzas at the oven, drop them on the counter, stand at SERVE, then collect the cash!', 7);

let last = performance.now(), saveT = 0;
function frame(now) {
  let gap = (now - last) / 1000; last = now;
  // A long gap means the window was hidden or throttled: pay idle income instead of simulating.
  if (gap > 5) { creditAway(gap); gap = 0; }
  const dt = Math.min(gap, 0.05);
  update(dt); render(); hud(dt);
  saveT += dt;
  if (saveT > 3) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// Test hook for automated checks.
window.__game = { get S() { return S; }, player, queue, walkers, ovens, tables, workers, carQueue, update, render, idleRate, unlock, UNLOCKS };
</script>
