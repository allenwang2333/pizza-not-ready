<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Ready (No Ads)</title>
<style>
  :root{--ui:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  html,body{margin:0;height:100%;background:#bfe3f2;overflow:hidden;font-family:var(--ui);
    user-select:none;-webkit-user-select:none;color:#fff}
  #c{display:block;touch-action:none;position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}

  /* world labels */
  .bubble{background:#fff;color:#3b2a1a;border-radius:14px;padding:3px 10px;font-weight:800;font-size:15px;
    box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;
    border-bottom:0;border-top-color:#fff}
  .bubble.done{background:#55efc4}
  .bubble.done:after{border-top-color:#55efc4}
  .bar{width:54px;height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;
    box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  .bar i{display:block;height:100%;background:linear-gradient(#ffe08a,#f6a623);border-radius:5px}
  .bar.green i{background:linear-gradient(#8ff5d2,#1fbf8f)}
  .tag{background:#e8553e;color:#fff;font-weight:900;font-size:11px;padding:2px 7px;border-radius:8px;
    box-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.5px}
  .money{color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 #1e7a4c,0 0 6px rgba(0,0,0,.4)}
  .alert{width:26px;height:26px;border-radius:50%;background:#ff5a4e;color:#fff;font-weight:900;font-size:18px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #b33326;animation:bob .6s ease-in-out infinite alternate}
  .icon{font-size:22px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
  .float{font-weight:900;font-size:20px;color:#7dffcf;text-shadow:0 2px 0 #106b45,0 0 8px rgba(0,0,0,.35)}
  .float.gold{color:#ffe17a;text-shadow:0 2px 0 #8a5a00,0 0 8px rgba(0,0,0,.35)}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}

  /* HUD */
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;
    align-items:center;pointer-events:none}
  #money{display:flex;align-items:center;gap:8px;background:linear-gradient(#2fbf71,#1d9a57);
    padding:5px 18px 5px 6px;border-radius:24px;font-size:24px;font-weight:900;
    box-shadow:0 4px 0 #136b3b,0 6px 14px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  #shopTag{background:rgba(40,25,10,.45);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800}
  #shopTag:empty{display:none}
  #money .coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f7c531 55%,#d99a0b);
    color:#a26a00;font-size:18px;display:flex;align-items:center;justify-content:center;text-shadow:none;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  #right{display:flex;gap:10px;pointer-events:auto}
  button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:8px 16px;font-weight:900;
    background:linear-gradient(#ffd56b,#f7b733);color:#5a3a06;box-shadow:0 4px 0 #b9821a,0 6px 12px rgba(0,0,0,.2);
    transition:transform .08s}
  button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b9821a}
  button:disabled{background:#b9b2a8;color:#eee;box-shadow:0 4px 0 #8a847c;cursor:default}
  #soundBtn,#zoomBtn{background:linear-gradient(#fff,#e9e2d6);color:#5a3a06;box-shadow:0 4px 0 #b5a993,0 6px 12px rgba(0,0,0,.2);padding:8px 12px}
  #upBtn.glow{animation:glow .9s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.15) drop-shadow(0 0 8px #ffe9a8)}}
  kbd{font:inherit;font-size:11px;background:rgba(0,0,0,.12);padding:1px 6px;border-radius:5px;margin-left:4px}
  #help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;
    background:rgba(40,25,10,.45);padding:5px 12px;border-radius:12px;pointer-events:none;white-space:nowrap}

  .modal{position:fixed;inset:0;background:rgba(30,18,8,.45);display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal[hidden]{display:none}
  .card{background:#fff8ec;color:#4a3112;border-radius:22px;padding:18px 18px 14px;width:min(540px,92vw);
    max-height:86vh;overflow:auto;box-shadow:0 8px 0 #d9c3a0,0 20px 50px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font-size:24px;font-weight:900;text-align:center;color:#e0592f}
  .row{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;background:#fff;border-radius:16px;
    box-shadow:0 3px 0 #ecdcc2}
  .row .ic{font-size:28px;width:46px;height:46px;border-radius:14px;background:#ffefd2;display:flex;
    align-items:center;justify-content:center}
  .row .tx{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px}
  .row .ds{font-size:12px;opacity:.75;margin-top:2px}
  .pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .pips i{width:10px;height:6px;border-radius:3px;background:#ecdcc2}
  .pips i.on{background:#f7a531}
  .row button{min-width:96px}
  .foot{display:flex;justify-content:space-between;margin-top:10px}
  #resetBtn{background:linear-gradient(#e9e2d6,#d6ccbc);color:#7a6a55;box-shadow:0 4px 0 #a99c88;font-size:12px}
  #toast{position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-10px);background:#fff8ec;color:#4a3112;
    padding:10px 18px;border-radius:16px;font-weight:800;font-size:15px;opacity:0;transition:.3s;pointer-events:none;
    text-align:center;max-width:80vw;box-shadow:0 4px 0 #d9c3a0,0 8px 20px rgba(0,0,0,.2)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud">
  <div id="left">
    <div id="money"><span class="coin">$</span><span id="moneyVal">0</span></div>
    <div id="shopTag"></div>
  </div>
  <div id="right">
    <button id="zoomBtn" title="Zoom (scroll wheel, - / =)">🔍</button>
    <button id="soundBtn" title="Sound (M)">🔊</button>
    <button id="shopsBtn">🗺️ Shops<kbd>L</kbd></button>
    <button id="upBtn">⬆️ Upgrades<kbd>U</kbd></button>
  </div>
</div>
<div id="help">WASD / arrows / hold mouse to move · scroll to zoom · walk onto ovens, mats, cash and $ zones · L shops</div>
<div id="panel" class="modal" hidden>
  <div class="card">
    <h2>Upgrades</h2>
    <div id="upList"></div>
    <div class="foot">
      <button id="resetBtn">Reset progress</button>
      <button id="closeBtn">Close<kbd>Esc</kbd></button>
    </div>
  </div>
</div>
<div id="shops" class="modal" hidden>
  <div class="card">
    <h2>Your Shops</h2>
    <div id="shopList"></div>
    <div class="foot"><span></span><button id="shopsClose">Close<kbd>Esc</kbd></button></div>
  </div>
</div>
<div id="toast"></div>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
// ================= helpers =================
let time = 0, nextId = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (x, y) => ({ x, y });

function moveTo(e, tx, ty, sp, dt) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= sp * dt || d < 0.5) { e.x = tx; e.y = ty; e.moving = false; return true; }
  e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
  e.dir = Math.atan2(dy, dx); e.moving = true;
  return false;
}
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e4) return '' + n;
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e5 ? 1 : 0) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  return (n / 1e9).toFixed(2) + 'B';
}
function fmtDur(s) {
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + ' min';
  return (s / 3600).toFixed(1) + ' h';
}

// ================= layout (game logic uses a 1200x800 top-down plane) =================
const ROOM = { x: 90, y: 40, w: 1100, h: 730 };
const COUNTER = { x: 540, y: 305, w: 260, h: 48 };
const DROP = P(600, 268), CASHIER = P(740, 268);
const DRIVE_COUNTER = { x: 92, y: 480, w: 46, h: 170 };
const DRIVE_DROP = P(172, 512), DRIVE_CASHIER = P(172, 618);
const QUEUE_X = 740, QUEUE_Y = 398, QUEUE_GAP = 44, MAX_QUEUE = 8;
const LEAVE_X = 805, AISLE_X = 880, MID_AISLE_X = 660, DOOR_X = 780, SPAWN = P(740, 850);
const CAR_X = 42, CAR_Y = 590, CAR_GAP = 100;
const PILES = { main: P(850, 272), drive: P(230, 730) };
const COUNTER_MAX = 40, DRIVE_MAX = 30;
const OVEN_POS = { oven1: P(170, 95), oven2: P(300, 95), oven3: P(430, 95), oven4: P(560, 95), oven5: P(690, 95) };
// aisle: the x where customers walk up and down to reach the table.
const TABLE_POS = {
  table1: { x: 980, y: 170, aisle: AISLE_X }, table2: { x: 1110, y: 170, aisle: AISLE_X },
  table3: { x: 980, y: 370, aisle: AISLE_X }, table4: { x: 1110, y: 370, aisle: AISLE_X },
  table5: { x: 980, y: 570, aisle: AISLE_X }, table6: { x: 1110, y: 570, aisle: AISLE_X },
  table7: { x: 420, y: 480, aisle: MID_AISLE_X }, table8: { x: 560, y: 480, aisle: MID_AISLE_X },
  table9: { x: 420, y: 650, aisle: MID_AISLE_X }, table10: { x: 560, y: 650, aisle: MID_AISLE_X },
};
const CARRIERS = ['carrier1', 'carrier2', 'carrier3'];
const WORKER_POST_IDLE = { cleaner: P(1045, 720) };

// Base costs; each location multiplies them by its costMult.
const UNLOCKS = [
  { id: 'table1',   cost: 20,    req: null,       x: 980,  y: 170, icon: '🪑', name: 'Table' },
  { id: 'oven2',    cost: 50,    req: 'table1',   x: 300,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'cashier',  cost: 100,   req: 'oven2',    x: 740,  y: 185, icon: '💁', name: 'Cashier' },
  { id: 'table2',   cost: 160,   req: 'cashier',  x: 1110, y: 170, icon: '🪑', name: 'Table' },
  { id: 'carrier1', cost: 250,   req: 'cashier',  x: 470,  y: 260, icon: '🧑‍🍳', name: 'Baker' },
  { id: 'table3',   cost: 380,   req: 'table2',   x: 980,  y: 370, icon: '🪑', name: 'Table' },
  { id: 'oven3',    cost: 560,   req: 'carrier1', x: 430,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'cleaner',  cost: 800,   req: 'table3',   x: 1045, y: 700, icon: '🧹', name: 'Cleaner' },
  { id: 'table4',   cost: 1150,  req: 'table3',   x: 1110, y: 370, icon: '🪑', name: 'Table' },
  { id: 'drive',    cost: 1600,  req: 'oven3',    x: 175,  y: 565, icon: '🚗', name: 'Drive-Thru' },
  { id: 'driver',   cost: 2300,  req: 'drive',    x: 260,  y: 640, icon: '🎧', name: 'Drive Clerk' },
  { id: 'table5',   cost: 3200,  req: 'table4',   x: 980,  y: 570, icon: '🪑', name: 'Table' },
  { id: 'carrier2', cost: 4400,  req: 'drive',    x: 380,  y: 260, icon: '🧑‍🍳', name: 'Baker' },
  { id: 'table6',   cost: 6000,  req: 'table5',   x: 1110, y: 570, icon: '🪑', name: 'Table' },
  { id: 'oven4',    cost: 8000,  req: 'carrier2', x: 560,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'table7',   cost: 10500, req: 'oven4',    x: 420,  y: 480, icon: '🪑', name: 'Table' },
  { id: 'table8',   cost: 13500, req: 'table7',   x: 560,  y: 480, icon: '🪑', name: 'Table' },
  { id: 'oven5',    cost: 17000, req: 'table7',   x: 690,  y: 95,  icon: '🔥', name: 'Oven' },
  { id: 'carrier3', cost: 21000, req: 'oven5',    x: 290,  y: 260, icon: '🧑‍🍳', name: 'Baker' },
  { id: 'table9',   cost: 26000, req: 'table8',   x: 420,  y: 650, icon: '🪑', name: 'Table' },
  { id: 'table10',  cost: 32000, req: 'table9',   x: 560,  y: 650, icon: '🪑', name: 'Table' },
];
// Appears in the newest shop after everything there is unlocked.
const NEW_SHOP = { id: 'newshop', x: 650, y: 728, icon: '🗺️', name: 'New Shop', fixed: 0 };
const NEXT_SHOP_COST = 15000;

// Each location is the same floor plan with a new look and bigger numbers.
const LOCATIONS = [
  { name: 'Corner Pizzeria', icon: '🧱', priceMult: 1,  costMult: 1,   orderMax: 3, carMult: 1,
    theme: { sky: '#bfe3f2', ground: ['#86cf5e', '60,140,50', '170,230,120'], floor: { kind: 'wood', h: 30, s: 42, l: 66 },
      tile: ['#fbf4e8', '#e8dac4'], wallKind: 'brick', wallHue: 10, wall: '#e7835f', trim: '#fff1dc',
      leaf: '#4fb35a', leaf2: '#62c46a', trunk: '#8a5a3b', cloth: ['#e8473b', '#fff7ef'] } },
  { name: 'Beach Shack', icon: '🏖️', priceMult: 3, costMult: 6, orderMax: 4, carMult: 1,
    theme: { sky: '#a6e4f7', ground: ['#f1d796', '200,160,90', '255,240,200'], floor: { kind: 'wood', h: 38, s: 30, l: 76 },
      tile: ['#f2fbfa', '#bfe9e4'], wallKind: 'planks', wallColor: '#4fc1bb', wall: '#5fd0c4', trim: '#fffaf0',
      leaf: '#33b56a', leaf2: '#4cd082', trunk: '#b08050', cloth: ['#2fb3e0', '#fffaf0'] } },
  { name: 'City Diner', icon: '🏙️', priceMult: 9, costMult: 36, orderMax: 4, carMult: 1.6,
    theme: { sky: '#c9d6e3', ground: ['#a7adb5', '80,85,95', '200,205,210'], floor: { kind: 'checker', a: '#f4f4f2', b: '#2e3440' },
      tile: ['#ffffff', '#f2b8b8'], wallKind: 'tiles', wallColor: '#3c6fd1', wall: '#4d7fe0', trim: '#f4f4f2',
      leaf: '#3f9e5a', leaf2: '#56b46e', trunk: '#6b5040', cloth: ['#3c6fd1', '#ffffff'] } },
  { name: 'Ski Lodge', icon: '🏔️', priceMult: 27, costMult: 216, orderMax: 5, carMult: 1.2,
    theme: { sky: '#dce9f5', ground: ['#f3f7fb', '190,205,220', '255,255,255'], floor: { kind: 'wood', h: 24, s: 45, l: 45 },
      tile: ['#f3ece0', '#dccdb5'], wallKind: 'logs', wallColor: '#8a5a3b', wall: '#9b6a45', trim: '#f3ece0',
      leaf: '#2f7d4f', leaf2: '#3d9461', trunk: '#6b4630', cloth: ['#2f7d4f', '#f3ece0'] } },
  { name: 'Moon Base', icon: '🚀', priceMult: 81, costMult: 1296, orderMax: 5, carMult: 2,
    theme: { sky: '#161a33', ground: ['#8d8f99', '60,62,72', '180,182,190'], floor: { kind: 'metal' },
      tile: ['#e3e6ec', '#c5cad3'], wallKind: 'panels', wallColor: '#5b6378', wall: '#6c7590', trim: '#d6dbe6',
      leaf: '#7a7f8c', leaf2: '#9a9fac', trunk: '#5b5f6b', cloth: ['#7a5cff', '#e3e6ec'] } },
];

// ================= upgrades =================
const playerSpeed = l => 170 + 22 * l;
const carryCap = l => 4 + 2 * l;
const ovenTime = l => 3 * Math.pow(0.86, l);
const ovenMax = l => 6 + l;
const pizzaPrice = l => 5 + 3 * l;
const staffSpeed = l => 120 + 18 * l;
const staffCap = l => 3 + l;
const spawnTimeFor = l => 4.5 * Math.pow(0.88, l);

const UPGRADES = [
  { id: 'speed', icon: '👟', name: 'Running Shoes', max: 8, base: 30, mult: 1.7,
    desc: l => `Speed ${playerSpeed(l)}`, next: l => `${playerSpeed(l + 1)}` },
  { id: 'cap', icon: '💪', name: 'Bigger Arms', max: 8, base: 40, mult: 1.75,
    desc: l => `Carry ${carryCap(l)} pizzas`, next: l => `${carryCap(l + 1)}` },
  { id: 'oven', icon: '🔥', name: 'Hotter Ovens', max: 10, base: 60, mult: 1.7,
    desc: l => `Bake ${ovenTime(l).toFixed(1)}s, hold ${ovenMax(l)}`,
    next: l => `${ovenTime(l + 1).toFixed(1)}s, ${ovenMax(l + 1)}` },
  { id: 'price', icon: '🍕', name: 'Better Recipe', max: 25, base: 80, mult: 1.4,
    desc: l => `Pizza sells for $${pizzaPrice(l)}`, next: l => `$${pizzaPrice(l + 1)}` },
  { id: 'cust', icon: '📣', name: 'Word of Mouth', max: 8, base: 120, mult: 1.8,
    desc: l => `Customer every ${spawnTimeFor(l).toFixed(1)}s`, next: l => `${spawnTimeFor(l + 1).toFixed(1)}s` },
  { id: 'staff', icon: '🎓', name: 'Staff Training', max: 6, base: 250, mult: 1.9, req: 'cashier',
    desc: l => `Staff speed ${staffSpeed(l)}, carry ${staffCap(l)}`,
    next: l => `${staffSpeed(l + 1)}, ${staffCap(l + 1)}` },
];
const upCost = u => Math.round(u.base * Math.pow(u.mult, L.up[u.id]) * loc().costMult);
const upLocked = u => u.req && !L.unlocked[u.req];
const canBuy = u => !upLocked(u) && L.up[u.id] < u.max && S.money >= upCost(u);

// ================= save state =================
const SAVE_KEY = 'pizza-ready-noads-v1';
const newShop = () => ({
  unlocked: { oven1: true }, paid: {},
  up: { speed: 0, cap: 0, oven: 0, price: 0, cust: 0, staff: 0 },
  counter: 0, drive: 0, piles: { main: 0, drive: 0 },
});
function freshState() {
  return { money: 0, earned: 0, sound: true, zoom: 1.2, t: 0, cur: 0, shops: [newShop()] };
}
function fixShop(d) {
  const sh = newShop();
  sh.unlocked = { ...d.unlocked, oven1: true }; sh.paid = { ...d.paid };
  Object.assign(sh.up, d.up); Object.assign(sh.piles, d.piles);
  sh.counter = d.counter | 0; sh.drive = d.drive | 0;
  return sh;
}
function loadState() {
  const s = freshState();
  let raw = null;
  try { raw = window.__SAVE__ || localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (!raw) return s;
  try {
    const d = JSON.parse(raw);
    for (const k of ['money', 'earned', 'sound', 'zoom', 't']) if (d[k] !== undefined) s[k] = d[k];
    // Saves from before locations kept a single shop at the top level.
    s.shops = Array.isArray(d.shops) && d.shops.length ? d.shops.map(fixShop) : [fixShop(d)];
    s.shops.length = Math.min(s.shops.length, LOCATIONS.length);
    s.cur = clamp(d.cur | 0, 0, s.shops.length - 1);
  } catch (e) {}
  return s;
}
let S = loadState(), L = S.shops[S.cur];
const loc = () => LOCATIONS[S.cur];
function save() {
  S.t = Date.now();
  const data = JSON.stringify(S);
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
  // The macOS wrapper app stores the save in Application Support.
  try { window.webkit.messageHandlers.save.postMessage(data); } catch (e) {}
}

// ================= world =================
const player = {
  id: nextId++, x: 600, y: 210, dir: Math.PI / 2, moving: false, stack: 0, actT: 0, seed: 0,
  shirt: '#e8473b', skin: '#f6d2b8', hat: 'chef', pants: '#3b3f58',
};
const ovens = [], tables = [], workers = [], queue = [], walkers = [], carQueue = [], carsOut = [];
const zoneStand = {};
let spawnT = 1.5, carT = 4, serveT = 0, driveServeT = 0;

const SHIRTS = ['#ef5b5b', '#4a9df8', '#38c979', '#a66cf0', '#f7c83c', '#f78a3c', '#2ec4b6', '#ff7eb6', '#4f5d75'];
const SKINS = ['#f6d2b8', '#e8b48a', '#c98d5e', '#8d5a3b', '#ffe0c4'];
const HAIRS = ['#2c1b10', '#5a3825', '#c99a3a', '#1a1a1a', '#a0522d', '#d8d0c8', '#e06a3a'];
const PANTS = ['#3b3f58', '#2f4b7c', '#6d4c41', '#46505a', '#1f6f78'];
const CAR_COLORS = ['#ef5b5b', '#4a9df8', '#f7a531', '#a66cf0', '#2ec4b6', '#f3f0ea', '#3a4255'];
const WORKER_LOOK = {
  cashier: { shirt: '#4a9df8', hat: 'cap', hatColor: '#1f6fd1', pants: '#3b3f58' },
  carrier: { shirt: '#f78a3c', hat: 'chef', pants: '#3b3f58' },
  cleaner: { shirt: '#38c979', hat: 'cap', hatColor: '#1f9a58', pants: '#2f4b7c' },
  driver:  { shirt: '#a66cf0', hat: 'cap', hatColor: '#6c3fc4', pants: '#3b3f58' },
};

function makeWorker(id) {
  const type = id.startsWith('carrier') ? 'carrier' : id;
  return {
    id: nextId++, key: id, type, x: DOOR_X, y: 760, dir: -Math.PI / 2, moving: false, stack: 0, actT: 0,
    state: 'fetch', oven: null, dest: 'counter', table: null,
    off: { carrier2: 24, carrier3: -24 }[id] || 0, seed: Math.random() * 10,
    skin: pick(SKINS), hair: pick(HAIRS), ...WORKER_LOOK[type],
  };
}
function syncWorld() {
  for (const id in OVEN_POS)
    if (L.unlocked[id] && !ovens.some(o => o.id === id)) ovens.push({ id, ...OVEN_POS[id], stock: 0, timer: 0 });
  for (const id in TABLE_POS)
    if (L.unlocked[id] && !tables.some(t => t.id === id))
      tables.push({ id, ...TABLE_POS[id], occupant: null, dirty: false, tip: 0, clean: 0 });
  for (const id of ['cashier', ...CARRIERS, 'cleaner', 'driver'])
    if (L.unlocked[id] && !workers.some(w => w.key === id)) workers.push(makeWorker(id));
}
syncWorld();

const pickPt = o => P(o.x, o.y + 80);
const price = () => pizzaPrice(L.up.price) * loc().priceMult;
// More ovens and tables make the shop more popular.
const spawnTimeOf = (cust, nOvens, nTables) => spawnTimeFor(cust) / (1 + 0.15 * (nOvens - 1) + 0.06 * nTables);
const spawnTime = () => spawnTimeOf(L.up.cust, ovens.length, tables.length);
const carTimeOf = (cust, li) => 11 * Math.pow(0.9, cust) / LOCATIONS[li].carMult;
const carTime = () => carTimeOf(L.up.cust, S.cur);
const zoneCost = d => d.fixed || d.cost * loc().costMult;
function visibleZones() {
  const z = UNLOCKS.filter(d => !L.unlocked[d.id] && (!d.req || L.unlocked[d.req]));
  const next = S.shops.length;
  if (!z.length && S.cur === next - 1 && next < LOCATIONS.length) {
    const nl = LOCATIONS[next];
    Object.assign(NEW_SHOP, { fixed: NEXT_SHOP_COST * nl.costMult, name: nl.name, icon: nl.icon });
    z.push(NEW_SHOP);
  }
  return z;
}
const workerAt = (type, pt) => workers.some(w => w.type === type && dist(w, pt) < 6);
const cashierPresent = () => dist(player, CASHIER) < 42 || workerAt('cashier', CASHIER);
const drivePresent = () => L.unlocked.drive && (dist(player, DRIVE_CASHIER) < 42 || workerAt('driver', DRIVE_CASHIER));

function obstacles() {
  const r = [COUNTER];
  for (const o of ovens) r.push({ x: o.x - 50, y: o.y - 35, w: 100, h: 88 });
  for (const t of tables) r.push({ x: t.x - 40, y: t.y - 25, w: 80, h: 48 });
  if (L.unlocked.drive) r.push(DRIVE_COUNTER);
  return r;
}
function pushOut(e, r, rad) {
  const cx = clamp(e.x, r.x, r.x + r.w), cy = clamp(e.y, r.y, r.y + r.h);
  const dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
  if (d > 0 && d < rad) { e.x = cx + dx / d * rad; e.y = cy + dy / d * rad; return; }
  if (d === 0) { // center inside the box: push out along the shortest axis
    const l = e.x - r.x, rt = r.x + r.w - e.x, t = e.y - r.y, b = r.y + r.h - e.y;
    const m = Math.min(l, rt, t, b);
    if (m === l) e.x = r.x - rad; else if (m === rt) e.x = r.x + r.w + rad;
    else if (m === t) e.y = r.y - rad; else e.y = r.y + r.h + rad;
  }
}

// ================= input =================
const keys = {};
const pointer = { down: false, sx: 0, sy: 0, x: 0, y: 0 };
const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'Space', 'KeyU', 'KeyM', 'KeyL', 'Escape', 'Minus', 'Equal'];
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'Minus') zoomBy(1.15);
  if (e.code === 'Equal') zoomBy(1 / 1.15);
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyU') togglePanel();
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'KeyL') toggleShops();
  if (e.code === 'Escape') { togglePanel(false); toggleShops(false); }
});
addEventListener('keyup', e => { keys[e.code] = false; if (GAME_KEYS.includes(e.code)) e.preventDefault(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });

// ================= audio =================
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = 0.04, delay = 0) {
  if (!S.sound || !AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  pop: () => tone(520 + Math.random() * 120, 0.05, 'sine', 0.02),
  cash: () => { tone(1320, 0.08, 'square', 0.02); tone(1760, 0.12, 'square', 0.02, 0.06); },
  unlock: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.05, i * 0.08)),
  up: () => { tone(660, 0.1, 'triangle', 0.05); tone(990, 0.15, 'triangle', 0.05, 0.08); },
};

// ================= effects =================
const fx = [];
function addFloat(x, y, t, cls = '') { fx.push({ k: 't', id: nextId++, x, y, t, cls, age: 0, life: 1.2 }); }
function addCoins(x, y, tgt, n) {
  for (let i = 0; i < n; i++) fx.push({ k: 'c', x0: x + rand(-10, 10), y0: y + rand(-10, 10), tgt, age: -i * 0.04, life: 0.45 });
}
function confetti(x, y) {
  for (let i = 0; i < 60; i++)
    fx.push({ k: 'p', px: X(x), py: 1, pz: Z(y), vx: rand(-3, 3), vy: rand(4, 9), vz: rand(-3, 3),
      c: pick(SHIRTS), r: rand(0, 6), age: 0, life: 1.6 });
}
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, sec = 3.5) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), sec * 1000);
}
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.age += dt;
    if (f.k === 'p') {
      f.vy -= 14 * dt; f.px += f.vx * dt; f.py = Math.max(0.02, f.py + f.vy * dt); f.pz += f.vz * dt;
      if (f.py <= 0.02) { f.vx *= 0.8; f.vz *= 0.8; }
    }
    if (f.age >= f.life) fx.splice(i, 1);
  }
}

// ================= update =================
function earn(amt, x, y) {
  S.money += amt; S.earned += amt;
  addFloat(x, y, '+$' + fmt(amt));
}

function updatePlayer(dt) {
  let vx = 0, vy = 0;
  if (keys.KeyW || keys.ArrowUp) vy--;
  if (keys.KeyS || keys.ArrowDown) vy++;
  if (keys.KeyA || keys.ArrowLeft) vx--;
  if (keys.KeyD || keys.ArrowRight) vx++;
  if (!vx && !vy && pointer.down) {
    pointerToWorld();
    const dx = pointer.x - player.x, dy = pointer.y - player.y, d = Math.hypot(dx, dy);
    if (d > 8) { vx = dx / d; vy = dy / d; }
  }
  const m = Math.hypot(vx, vy);
  if (m > 0) {
    const sp = playerSpeed(L.up.speed);
    player.x += vx / m * sp * dt; player.y += vy / m * sp * dt;
    player.dir = Math.atan2(vy, vx); player.moving = true;
  } else player.moving = false;
  player.x = clamp(player.x, ROOM.x + 14, ROOM.x + ROOM.w - 14);
  player.y = clamp(player.y, ROOM.y + 14, ROOM.y + ROOM.h - 14);
  for (const r of obstacles()) pushOut(player, r, 14);

  // pick up, drop off
  player.actT -= dt;
  const cap = carryCap(L.up.cap);
  if (player.actT <= 0) {
    for (const o of ovens) {
      if (o.stock > 0 && player.stack < cap && dist(player, pickPt(o)) < 50) {
        o.stock--; player.stack++; player.actT = 0.1; sfx.pop(); break;
      }
    }
  }
  if (player.actT <= 0 && player.stack > 0) {
    if (dist(player, DROP) < 50 && L.counter < COUNTER_MAX) {
      L.counter++; player.stack--; player.actT = 0.07; sfx.pop();
    } else if (L.unlocked.drive && dist(player, DRIVE_DROP) < 50 && L.drive < DRIVE_MAX) {
      L.drive++; player.stack--; player.actT = 0.07; sfx.pop();
    }
  }
  // collect cash
  for (const k in PILES) {
    if (L.piles[k] > 0 && dist(player, PILES[k]) < 50) {
      const amt = L.piles[k]; L.piles[k] = 0;
      earn(amt, player.x, player.y);
      addCoins(PILES[k].x, PILES[k].y - 10, player, Math.min(12, 3 + Math.floor(amt / 20)));
      sfx.cash();
    }
  }
  // clean tables
  for (const t of tables) {
    if (t.dirty && dist(player, t) < 75) {
      t.clean += dt * 1.6;
      if (t.clean >= 1) cleanTable(t, true);
    }
  }
}

function cleanTable(t, byPlayer) {
  if (byPlayer) { earn(t.tip, t.x, t.y); sfx.cash(); }
  else L.piles.main += t.tip;
  t.dirty = false; t.clean = 0; t.tip = 0;
}

function updateOvens(dt) {
  const max = ovenMax(L.up.oven), bake = ovenTime(L.up.oven);
  for (const o of ovens) {
    if (o.stock >= max) { o.timer = 0; continue; }
    o.timer += dt;
    if (o.timer >= bake) { o.timer = 0; o.stock++; }
  }
}

function updateWorkers(dt) {
  const sp = staffSpeed(L.up.staff);
  for (const w of workers) {
    w.actT -= dt;
    if (w.type === 'cashier') { if (moveTo(w, CASHIER.x, CASHIER.y, sp, dt)) w.dir = Math.PI / 2; }
    else if (w.type === 'driver') { if (moveTo(w, DRIVE_CASHIER.x, DRIVE_CASHIER.y, sp, dt)) w.dir = Math.PI; }
    else if (w.type === 'carrier') updateCarrier(w, sp, dt);
    else if (w.type === 'cleaner') updateCleaner(w, sp, dt);
  }
}

function updateCarrier(w, sp, dt) {
  const cap = staffCap(L.up.staff);
  const anyStock = ovens.some(o => o.stock > 0);
  if (w.state === 'fetch') {
    if (w.stack >= cap || (w.stack > 0 && !anyStock)) {
      w.state = 'deliver';
      w.dest = L.unlocked.drive && L.drive < L.counter ? 'drive' : 'counter';
      return;
    }
    if (!w.oven || (w.oven.stock === 0 && anyStock))
      w.oven = ovens.reduce((b, o) => (o.stock > b.stock || (o.stock === b.stock && o.timer > b.timer)) ? o : b, ovens[0]);
    const p = pickPt(w.oven);
    if (moveTo(w, p.x + w.off, p.y, sp, dt)) {
      w.dir = -Math.PI / 2;
      if (w.oven.stock > 0 && w.actT <= 0) { w.oven.stock--; w.stack++; w.actT = 0.18; }
    }
  } else {
    const d = w.dest === 'drive' ? DRIVE_DROP : DROP;
    if (moveTo(w, d.x + w.off, d.y, sp, dt) && w.actT <= 0) {
      if (w.dest === 'drive' && L.drive < DRIVE_MAX) { L.drive++; w.stack--; w.actT = 0.1; }
      else if (w.dest === 'counter' && L.counter < COUNTER_MAX) { L.counter++; w.stack--; w.actT = 0.1; }
      if (w.stack <= 0) { w.stack = 0; w.state = 'fetch'; w.oven = null; }
    }
  }
}

function updateCleaner(w, sp, dt) {
  if (!w.table || !w.table.dirty) w.table = tables.find(t => t.dirty) || null;
  if (!w.table) { const p = WORKER_POST_IDLE.cleaner; moveTo(w, p.x, p.y, sp, dt); return; }
  const t = w.table;
  if (moveTo(w, t.x, t.y + 45, sp, dt)) {
    w.dir = -Math.PI / 2;
    t.clean += dt;
    if (t.clean >= 1) { cleanTable(t, false); w.table = null; }
  }
}

function spawnCustomer() {
  queue.push({
    id: nextId++, x: SPAWN.x + rand(-8, 8), y: SPAWN.y, dir: -Math.PI / 2, moving: true,
    order: randi(1, loc().orderMax), got: 0, stack: 0, dine: Math.random() < 0.65,
    state: 'queue', path: [], next: null, table: null, timer: 0, seed: Math.random() * 10,
    shirt: pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIRS), pants: pick(PANTS), hairStyle: randi(0, 2),
  });
}

function finishOrder(c) {
  queue.shift();
  const pay = c.order * price();
  L.piles.main += pay;
  addFloat(QUEUE_X, QUEUE_Y, '$' + fmt(pay), 'gold');
  c.stack = c.order; c.state = 'walk';
  const t = c.dine ? tables.find(t => !t.occupant && !t.dirty) : null;
  if (t) {
    t.occupant = c; c.table = t; c.next = 'eat';
    // Walk in the row below the chairs so customers do not cross other tables.
    c.path = [P(t.aisle, QUEUE_Y), P(t.aisle, t.y + 80), P(t.x, t.y + 80), P(t.x, t.y + 45)];
  } else {
    c.next = 'gone';
    c.path = [P(LEAVE_X, QUEUE_Y + 10), P(LEAVE_X, 860)];
  }
  walkers.push(c);
}

function updateCustomers(dt) {
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = spawnTime() * rand(0.7, 1.3);
    if (queue.length < MAX_QUEUE) spawnCustomer();
  }
  queue.forEach((c, i) => moveTo(c, QUEUE_X, QUEUE_Y + i * QUEUE_GAP, 110, dt));
  const f = queue[0];
  if (f && f.x === QUEUE_X && f.y === QUEUE_Y && cashierPresent()) {
    serveT -= dt;
    if (serveT <= 0 && f.got < f.order && L.counter > 0) { L.counter--; f.got++; serveT = 0.22; }
    if (f.got >= f.order) finishOrder(f);
  }
  for (let i = walkers.length - 1; i >= 0; i--) {
    const c = walkers[i];
    if (c.state === 'eat') {
      c.timer -= dt;
      if (c.timer <= 0) {
        const t = c.table;
        t.occupant = null; t.dirty = true; t.tip = Math.round(price() * c.order * 0.5) + 2;
        c.table = null; c.state = 'walk'; c.next = 'gone';
        c.path = [P(t.x, t.y + 80), P(t.aisle, t.y + 80), P(t.aisle, 740), P(LEAVE_X, 760), P(LEAVE_X, 860)];
      }
      continue;
    }
    if (c.path.length) { const p = c.path[0]; if (moveTo(c, p.x, p.y, 110, dt)) c.path.shift(); }
    else if (c.next === 'eat') { c.state = 'eat'; c.timer = rand(6, 10); c.eatTotal = c.timer; c.stack = 0; c.dir = -Math.PI / 2; c.moving = false; }
    else walkers.splice(i, 1);
  }
}

function updateCars(dt) {
  if (L.unlocked.drive) {
    carT -= dt;
    if (carT <= 0) {
      carT = carTime() * rand(0.8, 1.2);
      if (carQueue.length < 3) carQueue.push({ id: nextId++, x: CAR_X, y: 900, order: randi(3, 6), got: 0, color: pick(CAR_COLORS) });
    }
  }
  carQueue.forEach((c, i) => moveTo(c, CAR_X, CAR_Y + i * CAR_GAP, 170, dt));
  const f = carQueue[0];
  if (f && f.y === CAR_Y && drivePresent()) {
    driveServeT -= dt;
    if (driveServeT <= 0 && f.got < f.order && L.drive > 0) { L.drive--; f.got++; driveServeT = 0.2; }
    if (f.got >= f.order) {
      carQueue.shift(); driveServeT = 0.4;
      const pay = Math.round(f.order * price() * 1.5);
      L.piles.drive += pay;
      addFloat(CAR_X, CAR_Y, '$' + fmt(pay), 'gold');
      carsOut.push(f);
    }
  }
  for (let i = carsOut.length - 1; i >= 0; i--)
    if (moveTo(carsOut[i], CAR_X, -150, 230, dt)) carsOut.splice(i, 1);
}

function updateZones(dt) {
  for (const d of visibleZones()) {
    const inside = Math.abs(player.x - d.x) < 38 && Math.abs(player.y - d.y) < 38;
    if (!inside) { zoneStand[d.id] = 0; continue; }
    zoneStand[d.id] = (zoneStand[d.id] || 0) + dt;
    if (zoneStand[d.id] < 0.25 || S.money <= 0) continue;
    const paid = L.paid[d.id] || 0, cost = zoneCost(d);
    const amt = Math.min(Math.max(cost / 1.5, 20) * dt, S.money, cost - paid);
    S.money -= amt; L.paid[d.id] = paid + amt;
    if (Math.random() < 0.3) fx.push({ k: 'c', x0: player.x, y0: player.y, tgt: P(d.x, d.y), age: 0, life: 0.35 });
    if (L.paid[d.id] >= cost - 1e-6) unlock(d);
  }
}

function unlock(d) {
  if (d === NEW_SHOP) {
    delete L.paid[d.id];
    S.shops.push(newShop());
    goToShop(S.shops.length - 1);
    sfx.unlock();
    return;
  }
  L.unlocked[d.id] = true; delete L.paid[d.id];
  syncWorld(); confetti(d.x, d.y); sfx.unlock();
  toast(`${d.icon} ${d.name} unlocked!`);
  save();
}

function goToShop(i) {
  save();
  S.cur = i; L = S.shops[i];
  for (const a of [ovens, tables, workers, queue, walkers, carQueue, carsOut, fx]) a.length = 0;
  Object.assign(player, { x: 600, y: 210, stack: 0, dir: Math.PI / 2, moving: false });
  spawnT = 1.5; carT = 4;
  syncWorld();
  resetScene();
  toast(`${loc().icon} Welcome to ${loc().name}!`);
  save();
}

function update(dt) {
  time += dt;
  // Other shops keep running in the background at their idle rate.
  const bg = otherShopsRate();
  S.money += bg * dt; S.earned += bg * dt;
  updatePlayer(dt);
  updateOvens(dt);
  updateWorkers(dt);
  updateCustomers(dt);
  updateCars(dt);
  updateZones(dt);
  updateFx(dt);
}

// Money per second a shop makes without the player. Needs a cashier and a baker.
function idleRateFor(sh, li) {
  const u = sh.unlocked, lc = LOCATIONS[li];
  if (!u.cashier || !u.carrier1) return 0;
  const nOvens = Object.keys(OVEN_POS).filter(id => u[id]).length;
  const nTables = Object.keys(TABLE_POS).filter(id => u[id]).length;
  const prod = nOvens / ovenTime(sh.up.oven);
  const drive = u.drive && u.driver ? 4.5 / carTimeOf(sh.up.cust, li) : 0;
  const demand = (1 + lc.orderMax) / 2 / spawnTimeOf(sh.up.cust, nOvens, nTables) + drive;
  const haul = CARRIERS.filter(id => u[id]).length * staffCap(sh.up.staff) / 7;
  return Math.min(prod, demand, haul) * pizzaPrice(sh.up.price) * lc.priceMult * 0.5;
}
const idleRate = () => S.shops.reduce((a, sh, i) => a + idleRateFor(sh, i), 0);
const otherShopsRate = () => S.shops.reduce((a, sh, i) => i === S.cur ? a : a + idleRateFor(sh, i), 0);
function creditAway(sec) {
  sec = Math.min(sec, 8 * 3600);
  const amt = Math.floor(idleRate() * sec);
  if (amt > 0) {
    S.money += amt; S.earned += amt; sfx.cash();
    toast(`👋 While you were away (${fmtDur(sec)}), your staff earned $${fmt(amt)}`, 5);
  }
}

// ---- materials, geometries, textures ----
const matCache = {};
function M(color, opts) {
  const k = color + (opts ? JSON.stringify(opts) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0, ...opts }));

// Box with rounded vertical edges and bevelled top and bottom edges.
function rbox(w, h, d, r) {
  const b = Math.min(r, h / 2 - 0.001, w / 2 - 0.01, d / 2 - 0.01);
  const sw = w - 2 * b, sd = d - 2 * b, cr = Math.min(b, sw / 2, sd / 2);

  s.moveTo(-sw / 2 + cr, -sd / 2); s.lineTo(sw / 2 - cr, -sd / 2); s.quadraticCurveTo(sw / 2, -sd / 2, sw / 2, -sd / 2 + cr);
  s.lineTo(sw / 2, sd / 2 - cr); s.quadraticCurveTo(sw / 2, sd / 2, sw / 2 - cr, sd / 2);
  s.lineTo(-sw / 2 + cr, sd / 2); s.quadraticCurveTo(-sw / 2, sd / 2, -sw / 2, sd / 2 - cr);
  s.lineTo(-sw / 2, -sd / 2 + cr); s.quadraticCurveTo(-sw / 2, -sd / 2, -sw / 2 + cr, -sd / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: h - 2 * b, bevelEnabled: true, bevelThickness: b,
    bevelSize: b, bevelSegments: 3, curveSegments: 4 });
  g.rotateX(-Math.PI / 2); g.center();
  return g;
}

function paint(tex, draw) {
  const cv = tex.image, c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height); draw(c, cv.width, cv.height); tex.needsUpdate = true;
}
// Random light or dark overlay, used to vary boards and logs.
const shade = (c, x, y, w, h, a) => { c.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,255,255'},${Math.random() * a})`; c.fillRect(x, y, w, h); };
function paintFloor(c, w, h, f) {
  if (f.kind === 'checker') {
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { c.fillStyle = (i + j) % 2 ? f.b : f.a; c.fillRect(i * 64, j * 64, 64, 64); }
  } else if (f.kind === 'metal') {
    c.fillStyle = '#9aa1ad'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      shade(c, i * 128 + 3, j * 128 + 3, 122, 122, 0.12);
      c.strokeStyle = 'rgba(40,45,60,.45)'; c.lineWidth = 3; c.strokeRect(i * 128 + 1.5, j * 128 + 1.5, 125, 125);
      c.fillStyle = 'rgba(40,45,60,.5)';
      for (const [rx, ry] of [[10, 10], [118, 10], [10, 118], [118, 118]]) { c.beginPath(); c.arc(i * 128 + rx, j * 128 + ry, 3, 0, Math.PI * 2); c.fill(); }
    }
  } else {
    for (let r = 0; r < 8; r++) {
      for (let x = -(r % 2) * 96; x < w; x += 192) {
        c.fillStyle = `hsl(${f.h + Math.random() * 6},${f.s + Math.random() * 8}%,${f.l + Math.random() * 7}%)`;
        c.fillRect(x, r * 32, 192, 32);
        c.fillStyle = 'rgba(110,65,30,.25)'; c.fillRect(x, r * 32, 2, 32);
      }
      c.fillStyle = 'rgba(110,65,30,.22)'; c.fillRect(0, r * 32, w, 2);
    }
  }
  noise(c, w, h, 1500, 0.05);
}
function paintWall(c, w, h, th) {
  c.fillStyle = th.wallColor || '#e9d2b4'; c.fillRect(0, 0, w, h);
  if (th.wallKind === 'brick') {
    c.fillStyle = '#e9d2b4'; c.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let x = -(r % 2) * 16; x < w; x += 32) {
      c.fillStyle = `hsl(${th.wallHue + Math.random() * 8},${52 + Math.random() * 10}%,${48 + Math.random() * 8}%)`;
      c.fillRect(x + 1.5, r * 16 + 1.5, 29, 13);
    }
  } else if (th.wallKind === 'planks') {
    for (let x = 0; x < w; x += 32) { shade(c, x, 0, 32, h, 0.14); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x, 0, 2, h); }
  } else if (th.wallKind === 'logs') {
    for (let y = 0; y < h; y += 32) {
      const g = c.createLinearGradient(0, y, 0, y + 32);
      g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(0.35, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(0,0,0,.4)');
      c.fillStyle = g; c.fillRect(0, y, w, 32);
    }
  } else if (th.wallKind === 'tiles') {
    for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) { shade(c, x, y, 16, 16, 0.1); }
    c.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i <= w; i += 16) c.fillRect(i, 0, 1.5, h);
    for (let i = 0; i <= h; i += 16) c.fillRect(0, i, w, 1.5);
  } else if (th.wallKind === 'panels') {
    for (let x = 0; x < w; x += 64) for (let y = 0; y < h; y += 64) {
      shade(c, x + 2, y + 2, 60, 60, 0.12);
      c.strokeStyle = 'rgba(20,25,40,.5)'; c.lineWidth = 3; c.strokeRect(x + 1.5, y + 1.5, 61, 61);
    }
  }
  noise(c, w, h, 800, 0.06);
}
function paintSign(name) {
  paint(TEX.sign, (c, w, h) => {
    c.fillStyle = '#3a2416'; c.beginPath(); c.roundRect(0, 0, w, h, 24); c.fill();
    const t = '🍕 ' + name.toUpperCase();
    c.font = `900 52px ${UI_FONT}`;
    const tw = c.measureText(t).width;
    if (tw > w - 40) c.font = `900 ${Math.floor(52 * (w - 40) / tw)}px ${UI_FONT}`;
    c.fillStyle = '#ffd25a'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t, w / 2, h / 2 + 3);
  });
}
function applyTheme(th) {
  scene.background.set(th.sky); scene.fog.color.set(th.sky);
  paint(TEX.grass, (c, w, h) => {
    c.fillStyle = th.ground[0]; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) { c.fillStyle = `rgba(${Math.random() < 0.5 ? th.ground[1] : th.ground[2]},.35)`; c.fillRect(Math.random() * w, Math.random() * h, 2, 3); }
  });
  paint(TEX.wood, (c, w, h) => paintFloor(c, w, h, th.floor));
  paint(TEX.tile, (c, w) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { c.fillStyle = th.tile[(i + j) % 2]; c.fillRect(i * 64, j * 64, 64, 64); }
    c.strokeStyle = 'rgba(150,120,90,.25)'; c.lineWidth = 2;
    for (let i = 0; i <= 2; i++) { c.beginPath(); c.moveTo(i * 64, 0); c.lineTo(i * 64, w); c.moveTo(0, i * 64); c.lineTo(w, i * 64); c.stroke(); }
  });
  paint(TEX.brick, (c, w, h) => paintWall(c, w, h, th));
  paint(TEX.cloth, c => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { c.fillStyle = th.cloth[(i + j) % 2]; c.fillRect(i * 16, j * 16, 16, 16); } });
  paint(TEX.stripes, c => { for (let i = 0; i < 4; i++) { c.fillStyle = th.cloth[i % 2]; c.fillRect(i * 16, 0, 16, 64); } });
  wallMat.color.set(th.wall); trimMat.color.set(th.trim);
  leafMat.color.set(th.leaf); leafMat2.color.set(th.leaf2); trunkMat.color.set(th.trunk);
  paintSign(loc().name);
}

  r.rotation.y = o.rot;
  if (e.moving) o.phase = (o.phase || 0) + dt * 11;
  const sit = e.state === 'eat', carrying = e.stack > 0;
  const swing = e.moving ? Math.sin(o.phase) * 0.7 : 0;
  o.legL.rotation.x = sit ? -1.45 : swing;
  o.legR.rotation.x = sit ? -1.45 : -swing;
  o.armL.rotation.x = carrying ? -1.3 : sit ? -0.9 + Math.sin(time * 7 + e.seed) * 0.35 : -swing * 0.8;
  o.armR.rotation.x = carrying ? -1.3 : sit ? -0.5 : swing * 0.8;
  o.body.position.y = (sit ? 0.06 : 0) + (e.moving ? Math.abs(Math.sin(o.phase)) * 0.07 : Math.sin(time * 2.5 + (e.seed || 0)) * 0.012);

      pushInst(boxIM, r.position.x + fx * 0.5 * s, (0.98 + o.body.position.y) * s + i * BOX_H, r.position.z + fz * 0.5 * s, o.rot);

function syncScene(dt) {
  syncFrame++;
  boxIM.count = billIM.count = coinIM.count = confIM.count = 0;
  const max = ovenMax(L.up.oven);

  for (const k in ovenMats) ovenMats[k].visible = false;
  for (const o of ovens) {
    const ob = objFor(o, makeOvenObj);
    popScale(ob);
    const x = X(o.x), z = Z(o.y);
    ob.root.position.set(x, 0, z);
    const f = 0.85 + Math.sin(time * 13 + x) * 0.12 + Math.sin(time * 7.3 + x) * 0.08;
    ob.fire.scale.set(f * 1.1, f * 0.7, 0.4); ob.ember.scale.set(1, f * 0.8, 0.4);
    ob.light.intensity = 1 + f * 0.8;
    for (let i = 0; i < o.stock; i++) pushInst(boxIM, x + (i < 8 ? -0.37 : 0.37), 0.85 + 0.065 + BOX_H * (i % 8), z + 1.25, (i % 3 - 1) * 0.04);
    if (!ovenMats[o.id]) ovenMats[o.id] = makeMat(pickPt(o), 'PICK UP', '🍕', '#ffffff');
    ovenMats[o.id].visible = true;
    const pct = Math.round(o.timer / ovenTime(L.up.oven) * 100);
    label('oven' + o.id, x, 2.75, z, o.stock >= max ? '<span class="tag">FULL</span>' : `<div class="bar"><i style="width:${pct}%"></i></div>`);
  }

  // counter stock
  const cz = Z(COUNTER.y + COUNTER.h / 2);
  for (let i = 0; i < L.counter; i++) pushInst(boxIM, X(COUNTER.x + 24 + Math.floor(i / 10) * 28), 1.06 + 0.065 + BOX_H * (i % 10), cz, (i % 3 - 1) * 0.05);
  if (L.counter >= COUNTER_MAX) label('cfull', X(COUNTER.x + 66), 2.9, cz, '<span class="tag">FULL</span>');

  // drive-thru
  const driveOn = !!L.unlocked.drive;
  if (driveOn && driveCounter.userData.born === undefined) driveCounter.userData.born = firstSync ? -10 : time;
  driveCounter.visible = driveRoad.visible = driveWallSill.visible = driveOn;
  driveWallFull.visible = !driveOn;
  driveMats.forEach(m => { m.visible = driveOn; });
  if (driveOn) {
    driveCounter.scale.setScalar(Math.max(0.001, easeOutBack(clamp((time - driveCounter.userData.born) / 0.45, 0, 1))));
    for (let i = 0; i < L.drive; i++)
      pushInst(boxIM, driveCounter.position.x, 1.06 + 0.065 + BOX_H * (i % 10), Z(DRIVE_COUNTER.y + 22) + Math.floor(i / 10) * 0.72, Math.PI / 2);
  }

  // tables
  for (const t of tables) {
    const ob = objFor(t, makeTableObj);
    popScale(ob);
    ob.root.position.set(X(t.x), 0, Z(t.y));
    const c = t.occupant, eating = c && c.state === 'eat';
    const left = eating ? Math.ceil(8 * c.timer / c.eatTotal) : 0;
    ob.slices.forEach((s, i) => { s.visible = i < left; });
    ob.plate.visible = eating || t.dirty;
    ob.dirty.visible = t.dirty;
    if (t.dirty) label('tbl' + t.id, X(t.x), 1.9, Z(t.y),
      `<div style="text-align:center"><div class="icon">🧽</div>${t.clean > 0 ? `<div class="bar green"><i style="width:${Math.round(t.clean * 100)}%"></i></div>` : ''}</div>`);
  }

  // people
  animPerson(player, dt);
  for (const w of workers) animPerson(w, dt);
  for (const c of queue) animPerson(c, dt);
  for (const c of walkers) animPerson(c, dt);
  playerRing.position.set(X(player.x), 0.012, Z(player.y));
  const cap = carryCap(L.up.cap);
  if (player.stack >= cap) label('max', X(player.x), 1.75 + cap * BOX_H, Z(player.y), '<span class="tag">MAX</span>');

  // cars
  for (const c of [...carQueue, ...carsOut]) objFor(c, makeCarObj).root.position.set(X(c.x), 0, Z(c.y));

  // cash piles
  for (const k in PILES) {
    const amt = L.piles[k]; if (amt <= 0) continue;
    const p = PILES[k], n = Math.min(30, 1 + Math.floor(amt / 8));
    for (let i = 0; i < n; i++) {
      const col = i % 3, row = Math.floor(i / 3);
      pushInst(billIM, X(p.x) + (col - 1) * 0.3, 0.035 + row * 0.072, Z(p.y) + (col === 1 ? -0.18 : 0.1), Math.sin(i * 12.9) * 0.15 + Math.PI / 2);
    }
    label('pile' + k, X(p.x), 0.55 + Math.ceil(n / 3) * 0.072, Z(p.y), `<span class="money">$${fmt(amt)}</span>`);
  }

  // unlock zones
  for (const d of visibleZones()) {
    const ob = objFor(d, makeZoneObj);
    drawZone(ob, d);
    const s = S.money >= zoneCost(d) - (L.paid[d.id] || 0) ? 1 + Math.sin(time * 6) * 0.04 : 1;
    ob.root.scale.set(s, s, 1);
  }

  // bubbles and hints
  const f = queue[0];
  if (f && f.x === QUEUE_X && f.y === QUEUE_Y)
    label('bub' + f.id, X(f.x), 2.35, Z(f.y), `<div class="bubble">🍕 ${f.got}/${f.order}</div>`);
  const fc = carQueue[0];
  if (fc && fc.y === CAR_Y) label('car' + fc.id, X(fc.x), 2.1, Z(fc.y), `<div class="bubble">🍕 ${fc.got}/${fc.order}</div>`);
  if (f && f.y === QUEUE_Y && !cashierPresent() && L.counter > 0) label('alert', X(CASHIER.x), 1.4, Z(CASHIER.y), '<div class="alert">!</div>');

  const gt = guideTarget();
  arrow.visible = !!gt && dist(player, gt) > 40;
  if (gt) { arrow.position.set(X(gt.x), 1.6 + Math.abs(Math.sin(time * 4)) * 0.45, Z(gt.y)); arrow.rotation.y += dt * 2.5; }
  floorArrow.visible = !!gt && dist(player, gt) > 120;
  if (floorArrow.visible) {
    const dx = gt.x - player.x, dy = gt.y - player.y, d = Math.hypot(dx, dy), r = 1.05 + Math.sin(time * 6) * 0.08;
    floorArrow.position.set(X(player.x) + dx / d * r, 0.02, Z(player.y) + dy / d * r);
    floorArrow.rotation.y = Math.atan2(-dx, -dy);
  }

  // effects
  for (const e of fx) {
    const t = clamp(e.age / e.life, 0, 1);
    if (e.k === 't') {
      const el = label('fx' + e.id, X(e.x), 2.3 + t * 1.2, Z(e.y), `<span class="float ${e.cls}">${e.t}</span>`);
      el.style.opacity = (1 - t * t).toFixed(2);
    } else if (e.k === 'c' && e.age >= 0) {
      const x = lerp(e.x0, e.tgt.x, t), y = lerp(e.y0, e.tgt.y, t);
      pushInst(coinIM, X(x), 0.6 + t * 0.8 + Math.sin(t * Math.PI) * 1.4, Z(y), 0, Math.PI / 2 * 0.6, time * 10);
    } else if (e.k === 'p') {
      pushInst(confIM, e.px, e.py, e.pz, e.r + e.age * 6, e.r * 2 + e.age * 8, 0);
      confIM.setColorAt(confIM.count - 1, tmpC.set(e.c));
    }
  }

  for (const im of [boxIM, billIM, coinIM, confIM]) im.instanceMatrix.needsUpdate = true;
  if (confIM.instanceColor) confIM.instanceColor.needsUpdate = true;

  // remove objects whose entity is gone
  for (const [e, o] of objs) if (o.seen !== syncFrame) { scene.remove(o.root); objs.delete(e); }
  firstSync = false;
}

function guideTarget() {
  if (L.unlocked.carrier1) return null;
  if (player.stack > 0) return DROP;
  if (queue[0] && L.counter > 0) return CASHIER;
  if (L.piles.main > 0) return PILES.main;
  const z = visibleZones().find(d => S.money >= zoneCost(d) - (L.paid[d.id] || 0));
  if (z) return z;
  return pickPt(ovens.reduce((b, o) => o.stock > b.stock ? o : b, ovens[0]));
}

// ================= HUD & panel =================
const moneyEl = document.getElementById('moneyVal');
const upBtn = document.getElementById('upBtn'), soundBtn = document.getElementById('soundBtn');
const panel = document.getElementById('panel'), upList = document.getElementById('upList');
let shownMoney = -1;

upList.innerHTML = UPGRADES.map(u => `
  <div class="row" data-id="${u.id}">
    <div class="ic">${u.icon}</div>
    <div class="tx"><div class="nm"></div><div class="ds"></div><div class="pips"></div></div>
    <button data-id="${u.id}"></button>
  </div>`).join('');
upList.addEventListener('click', e => { const id = e.target.closest('button')?.dataset.id; if (id) buyUpgrade(id); });

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!canBuy(u)) return;
  S.money -= upCost(u); L.up[id]++;
  sfx.up(); refreshPanel(); save();
}
function refreshPanel() {
  for (const u of UPGRADES) {
    const row = upList.querySelector(`.row[data-id="${u.id}"]`), l = L.up[u.id];
    row.querySelector('.nm').textContent = u.name;
    row.querySelector('.ds').textContent = l >= u.max ? u.desc(l) : `${u.desc(l)}  →  ${u.next(l)}`;
    const pips = row.querySelector('.pips');
    const html = Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
    if (pips._html !== html) { pips.innerHTML = html; pips._html = html; }
    const b = row.querySelector('button');
    if (upLocked(u)) { b.textContent = 'Need cashier'; b.disabled = true; }
    else if (l >= u.max) { b.textContent = 'MAX'; b.disabled = true; }
    else { b.textContent = '$' + fmt(upCost(u)); b.disabled = S.money < upCost(u); }
  }
}
function togglePanel(open = panel.hidden) {
  panel.hidden = !open;
  if (open) { shopsPanel.hidden = true; refreshPanel(); }
}

const shopsPanel = document.getElementById('shops'), shopList = document.getElementById('shopList');
function refreshShops() {
  const html = LOCATIONS.map((lc, i) => {
    const owned = i < S.shops.length, next = i === S.shops.length, known = owned || next;
    let info, btn = '<button disabled>Locked</button>';
    if (owned) {
      const sh = S.shops[i], done = UNLOCKS.filter(d => sh.unlocked[d.id]).length;
      info = `${done}/${UNLOCKS.length} unlocked · ` + (i === S.cur ? 'you are here' : `earning $${fmt(idleRateFor(sh, i))}/s`);
      btn = i === S.cur ? '<button disabled>Here</button>' : `<button data-shop="${i}">Go</button>`;
    } else if (next) {
      info = `Unlock everything in ${LOCATIONS[i - 1].name}, then pay $${fmt(NEXT_SHOP_COST * lc.costMult)}`;
    } else info = 'Open more shops to find out';
    return `<div class="row"><div class="ic">${known ? lc.icon : '❔'}</div>
      <div class="tx"><div class="nm">${known ? lc.name : '???'}</div><div class="ds">${info}</div>
      ${known ? `<div class="ds">Pizza prices ×${lc.priceMult}</div>` : ''}</div>${btn}</div>`;
  }).join('');
  if (shopList._html !== html) { shopList.innerHTML = html; shopList._html = html; }
}
shopList.addEventListener('click', e => {
  const i = e.target.closest('button')?.dataset.shop;
  if (i !== undefined) { toggleShops(false); goToShop(+i); }
});
function toggleShops(open = shopsPanel.hidden) {
  shopsPanel.hidden = !open;
  if (open) { panel.hidden = true; refreshShops(); }
}
document.getElementById('shopsBtn').onclick = () => { initAudio(); toggleShops(); };
document.getElementById('shopsClose').onclick = () => toggleShops(false);
shopsPanel.addEventListener('pointerdown', e => { if (e.target === shopsPanel) toggleShops(false); });
function toggleSound() { S.sound = !S.sound; soundBtn.textContent = S.sound ? '🔊' : '🔇'; save(); }
upBtn.onclick = () => { initAudio(); togglePanel(); };
soundBtn.onclick = () => { initAudio(); toggleSound(); };
document.getElementById('zoomBtn').onclick = () => { cam.zoom = cam.zoom > 1.3 ? 1 : 1.75; S.zoom = cam.zoom; };
document.getElementById('closeBtn').onclick = () => togglePanel(false);
panel.addEventListener('pointerdown', e => { if (e.target === panel) togglePanel(false); });
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('Reset all progress?')) return;
  S = freshState(); save(); location.reload();
};
soundBtn.textContent = S.sound ? '🔊' : '🔇';

let panelT = 0;
const shopTag = document.getElementById('shopTag');
function hud(dt) {
  const m = Math.floor(S.money);
  if (m !== shownMoney) { moneyEl.textContent = fmt(m); shownMoney = m; }
  const bg = otherShopsRate();
  const tag = S.shops.length > 1 ? `${loc().icon} ${loc().name}` + (bg > 0 ? ` · +$${fmt(bg)}/s from other shops` : '') : '';
  if (shopTag.textContent !== tag) shopTag.textContent = tag;
  upBtn.classList.toggle('glow', UPGRADES.some(canBuy));
  panelT -= dt;
  if (panelT <= 0) {
    panelT = 0.25;
    if (!panel.hidden) refreshPanel();
    if (!shopsPanel.hidden) refreshShops();
  }
}

// ================= main loop =================
if (S.t && Date.now() - S.t > 30000) creditAway((Date.now() - S.t) / 1000);
else if (!S.earned) toast('🍕 Grab pizzas at the oven, drop them on the counter, stand at SERVE, then collect the cash!', 7);

function renderFrame(dt) {
  updateCamera(dt);
  syncScene(dt);
  renderer.render(scene, camera);
  sweepLabels();
}

let last = performance.now(), saveT = 0, skip = 0, pendingDt = 0;
function frame(now) {
  // rAF timestamps can be slightly older than the last performance.now() call.
  let gap = Math.max(0, (now - last) / 1000); last = now;
  // A long gap means the window was hidden or throttled: pay idle income instead of simulating.
  if (gap > 5) { creditAway(gap); gap = 0; }
  const dt = Math.min(gap, 0.05);
  update(dt); hud(dt);
  // Draw at half rate while the window is in the background to save battery.
  pendingDt += dt;
  if (document.hasFocus() || ++skip % 2 === 0) { renderFrame(pendingDt); pendingDt = 0; }
  saveT += dt;
  if (saveT > 3) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// Test hook for automated checks.
window.__game = { get S() { return S; }, get L() { return L; }, goToShop, buyUpgrade, UPGRADES, zoneCost, visibleZones, player, queue, walkers, ovens, tables, workers, carQueue, update,
  renderFrame, idleRate, unlock, UNLOCKS, cam, renderer };
</script>
</body>
